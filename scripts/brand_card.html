<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- README 横幅与社交分享图的渲染模板，由 scripts/make_assets.sh 用无头 Chrome 截图生成 PNG -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&family=Noto+Sans+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=block">
<style>
  :root { --bg:#f2f4f7; --ink:#121822; --ink2:#455163; --ink3:#6b7686; --track:#dde3ea; --build:#2f5bd3; --maintain:#0f8a6a; --leverage:#b67d06; --dot-bg:#ffffff; }
  .dark { --bg:#0e1217; --ink:#e7ecf2; --ink2:#aab4c0; --ink3:#808b98; --track:#2a333e; --build:#5f7ff0; --maintain:#1f9e7a; --leverage:#b5861d; --dot-bg:#161b21; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans SC", "Noto Sans CJK SC", sans-serif; display: flex; align-items: center; overflow: hidden; }
  .wrap { display: flex; align-items: center; gap: 56px; padding: 0 76px; width: 100%; box-sizing: border-box; }
  .fly { flex: none; }
  .copy { min-width: 0; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: .2em; color: var(--ink3); text-transform: uppercase; display: flex; gap: 12px; align-items: center; }
  .eyebrow i { width: 9px; height: 9px; border-radius: 50%; background: var(--build); display: inline-block; }
  h1 { font-family: "Noto Serif SC", "Noto Serif CJK SC", serif; font-weight: 900; font-size: 84px; line-height: 1.1; margin: 14px 0 16px; letter-spacing: .03em; }
  .sub { font-size: 25px; color: var(--ink2); font-weight: 500; line-height: 1.55; margin: 0 0 24px; }
  .stats { display: flex; gap: 28px; font-size: 19px; color: var(--ink2); flex-wrap: wrap; }
  .stats b { font-family: "JetBrains Mono", monospace; font-size: 27px; color: var(--ink); margin-right: 6px; font-weight: 600; }
  .url { font-family: "JetBrains Mono", monospace; font-size: 19px; color: var(--ink3); margin-top: 26px; }
  .og h1 { font-size: 92px; }
  .og .sub { font-size: 27px; }
  .fly-label { font-family: "Noto Serif SC", "Noto Serif CJK SC", serif; font-weight: 900; font-size: 15px; fill: var(--ink); }
  .fly-center { font-family: "Noto Serif SC", "Noto Serif CJK SC", serif; font-weight: 900; font-size: 34px; fill: var(--ink); }
  .fly-sub { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .2em; fill: var(--ink3); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="fly" id="fly"></div>
  <div class="copy">
    <div class="eyebrow"><i></i>Personal Brand Flywheel</div>
    <h1>个人品牌飞轮</h1>
    <p class="sub">建立 · 维护 · 利用<br>一套可执行、可度量、可迭代的个人品牌系统</p>
    <div class="stats"><span><b id="n-sections">22</b>节方法</span><span><b id="n-tools">12</b>个交互工具</span><span><b id="n-personas">8</b>条角色路线</span><span><b id="n-checklists">11</b>份行动清单</span></div>
    <div class="url" id="url" hidden>vx-zjr.github.io/personal-brand-flywheel</div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("theme") === "dark") document.documentElement.classList.add("dark");
  const og = q.get("mode") === "og";
  if (og) { document.body.classList.add("og"); document.getElementById("url").hidden = false; }
  // 统计数字可由 scripts/make_assets.sh 通过锚点参数传入（读取 dist/build-info.json）
  ["sections", "tools", "personas", "checklists"].forEach((k) => { const v = q.get(k); if (v) document.getElementById("n-" + k).textContent = v; });
  const size = og ? 400 : 330;
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = el("svg", { viewBox: "0 0 320 320", width: size, height: size });
  const C = 160, R = 108, gap = 5, rad = (d) => d * Math.PI / 180;
  const P = (deg, r) => [C + Math.cos(rad(deg)) * (r || R), C + Math.sin(rad(deg)) * (r || R)];
  svg.append(el("circle", { cx: C, cy: C, r: R + 22, fill: "none", stroke: "var(--track)", "stroke-width": 1 }));
  svg.append(el("circle", { cx: C, cy: C, r: R - 22, fill: "none", stroke: "var(--track)", "stroke-width": 1 }));
  [["建立", "--build"], ["维护", "--maintain"], ["利用", "--leverage"]].forEach(([label, color], i) => {
    const a0 = -90 + i * 120 + gap, a1 = -90 + (i + 1) * 120 - gap;
    const [x0, y0] = P(a0), [x1, y1] = P(a1);
    svg.append(el("path", { d: `M${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1}`, fill: "none", stroke: `var(${color})`, "stroke-width": 26 }));
    const tip = a1 + (15 / R) * (180 / Math.PI);
    const [tx, ty] = P(tip), [b1x, b1y] = P(a1, R + 17), [b2x, b2y] = P(a1, R - 17);
    svg.append(el("polygon", { points: [b1x, b1y, tx, ty, b2x, b2y].join(","), fill: `var(${color})` }));
    const [lx, ly] = P(-90 + i * 120 + 60, R + 34);
    const t = el("text", { x: lx, y: ly + 5, "text-anchor": Math.abs(lx - C) < 10 ? "middle" : lx > C ? "start" : "end", class: "fly-label" });
    t.textContent = label; svg.append(t);
  });
  const c1 = el("text", { x: C, y: C + 6, "text-anchor": "middle", class: "fly-center" }); c1.textContent = "信任"; svg.append(c1);
  const c2 = el("text", { x: C, y: C + 28, "text-anchor": "middle", class: "fly-sub" }); c2.textContent = "TRUST"; svg.append(c2);
  svg.append(el("circle", { cx: P(-30 + 32)[0], cy: P(-30 + 32)[1], r: 6, fill: "var(--dot-bg)", stroke: "var(--ink)", "stroke-width": 2 }));
  document.getElementById("fly").append(svg);
</script>
</body>
</html>
