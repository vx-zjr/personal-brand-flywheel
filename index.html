            else cur[key] = it.id;
            save(cur); renderQuiz(); renderRes();
          });
          chips.append(c);
        });
        wrap.append(chips);
        return wrap;
      }
      function renderQuiz() {
        PB.clear(quiz);
        quiz.append(h("div", { class: "panel-title", text: "回答 6 个问题" }),
          chipGroup("1. 你的受众主要在哪里？", Q.regions, "region", false),
          chipGroup("2. 你擅长或愿意尝试的表达形式", Q.formats, "formats", true, "可多选"),
          chipGroup("3. 你的目标受众", Q.audiences, "audiences", true, "可多选"),
          chipGroup("4. 你最想要的结果", Q.goals, "goals", true, "可多选"),
          chipGroup("5. 每周能投入的时间", Q.times, "time", false),
          chipGroup("6. 是否愿意出镜", Q.faces, "face", false));
      }
      function detailRow(r, role) {
        const p = r.p;
        const why = [];
        if (r.fm.length) why.push("形式匹配：" + r.fm.map((x) => nameOf(Q.formats, x)).join("、"));
        if (r.au.length) why.push("人群匹配：" + r.au.map((x) => nameOf(Q.audiences, x)).join("、"));
        if (r.go.length) why.push("目标匹配：" + r.go.map((x) => nameOf(Q.goals, x)).join("、"));
        return h("div", { class: "plat-row" + (role === "主阵地" ? " top" : "") },
          h("div", { class: "plat-top" },
            h("div", { class: "plat-name" }, p.name, role ? h("span", { class: "badge " + (role === "主阵地" ? "build" : role === "自有阵地" ? "maintain" : ""), text: role }) : null),
            h("div", { class: "plat-score" }, h("span", { text: "匹配度 " + r.score }), h("span", { class: "meter" }, h("span", { style: { width: r.score + "%" } })))),
          h("div", { class: "plat-why", text: (why.join("；") || "与你的选择匹配度较低") + "。制作难度 " + p.effort + "/5，内容寿命" + p.lifespan + "。" }),
          h("div", { class: "plat-detail" },
            h("div", {}, h("b", { text: "优势" }), p.strengths),
            h("div", {}, h("b", { text: "注意" }), p.watch),
            h("div", {}, h("b", { text: "变现方式" }), p.monetize)));
      }
      function renderRes() {
        const st = get();
        const ranked = PB.platformRank(st);
        PB.clear(res);
        PB.clear(shell.badges);
        if (isExample()) shell.badges.append(PB.exampleBadge("示例选择"));
        const rented = ranked.filter((r) => !r.owned);
        const owned = ranked.filter((r) => r.owned)[0];
        res.append(h("div", { class: "panel-title" }, h("span", { text: "推荐组合" }), h("span", { class: "muted small", text: "1 主阵地 + 1 分发 + 1 自有" })));
        res.append(h("div", { class: "plat-results" },
          rented[0] ? detailRow(rented[0], "主阵地") : null,
          rented[1] ? detailRow(rented[1], "分发阵地") : null,
          owned ? detailRow(owned, "自有阵地") : null));
        const more = rented.slice(2, 6);
        if (more.length) {
          res.append(h("div", { class: "panel-title", text: "备选" }));
          res.append(PB.hbars(more.map((r) => ({ label: r.p.name, value: r.score, display: String(r.score) })), 100));
        }
        res.append(h("p", { class: "note", text: "匹配度只是起点：先在主阵地连续发布 8–12 周，再用真实数据决定是否调整。" }));
        renderLib(st);
      }
      function renderLib(st) {
        PB.clear(lib);
        const P = PB.content.tools.platforms.filter((p) => st.region === "both" || p.region === "any" || p.region === st.region);
        lib.append(h("summary", { class: "panel-title", style: { cursor: "pointer" } }, h("span", { text: "平台图谱（" + P.length + " 个，按你的地区筛选）" }), PB.icon("chevron", "sm")));
        lib.append(h("div", { class: "plat-lib" }, P.map((p) => h("article", { class: "plat-card" },
          h("strong", { text: p.name }),
          h("div", { class: "plat-tags" }, p.formats.map((f) => h("span", { class: "badge", text: nameOf(Q.formats, f) }))),
          h("span", { text: p.strengths }),
          h("span", { class: "small muted", text: "注意：" + p.watch }),
          h("span", { class: "small muted", text: "变现：" + p.monetize })))));
      }
      renderQuiz();
      renderRes();
    }
  };
})();

/* ==== 45-tool-calendar.js ==== */
/* 45-tool-calendar.js — 内容日历：内容支柱（占比）× 发布节奏 → 4 周日历；选题池（ICE 排序）；AI 生成选题。
   存储键 calendar = { pillars: [{id,name,ratio}], channels: [{id,name,perWeek,format}], start: "YYYY-MM-DD",
                       topics: [{id,title,pillar,impact,confidence,ease,done}] } */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;
  const WD = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const ice = (t) => (+t.impact || 0) * (+t.confidence || 0) * (+t.ease || 0);
  PB.ice = ice;

  function parseDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
  function nextMonday() { const d = new Date(); const m = mondayOf(d); if (m.getTime() < new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()) m.setDate(m.getDate() + 7); return m; }

  PB.calendarSchedule = function schedule(cal) {
    const start = mondayOf(parseDate(cal.start) || nextMonday());
    const slots = [];
    (cal.channels || []).forEach((ch) => {
      const n = PB.clamp(parseInt(ch.perWeek, 10) || 0, 0, 14);
      for (let w = 0; w < 4; w++) for (let k = 0; k < n; k++) slots.push({ day: w * 7 + Math.min(6, Math.floor(((k + 0.5) * 7) / n)), ch });
    });
    slots.sort((a, b) => a.day - b.day);
    const pillars = (cal.pillars || []).filter((p) => (p.name || "").trim() && +p.ratio > 0);
    const total = pillars.reduce((n, p) => n + +p.ratio, 0);
    const assigned = pillars.map(() => 0);
    slots.forEach((s, idx) => {
      if (!pillars.length) return;
      let best = 0, bestDef = -Infinity;
      pillars.forEach((p, i) => { const def = ((idx + 1) * +p.ratio) / total - assigned[i]; if (def > bestDef + 1e-9) { bestDef = def; best = i; } });
      assigned[best]++;
      s.pillar = pillars[best];
    });
    const pool = (cal.topics || []).filter((t) => !t.done).slice().sort((a, b) => ice(b) - ice(a));
    const used = {};
    slots.forEach((s) => {
      if (!s.pillar) return;
      const t = pool.find((x) => !used[x.id] && x.pillar === s.pillar.name);
      if (t) { used[t.id] = 1; s.topic = t; }
      const d = new Date(start); d.setDate(d.getDate() + s.day); s.date = d;
    });
    slots.forEach((s) => { if (!s.date) { const d = new Date(start); d.setDate(d.getDate() + s.day); s.date = d; } });
    return { start, slots, pillars };
  };

  function toMarkdown(plan) {
    const rows = plan.slots.map((s) => "| " + ymd(s.date) + " | " + WD[(s.date.getDay() + 6) % 7] + " | " + (s.ch.name || "") + " | " + (s.ch.format || "") + " | " + (s.pillar ? s.pillar.name : "") + " | " + (s.topic ? s.topic.title : "") + " |");
    return "| 日期 | 星期 | 平台 | 形式 | 内容支柱 | 选题 |\n|---|---|---|---|---|---|\n" + rows.join("\n");
  }
  function toCsv(plan) {
    const q = (v) => '"' + String(v || "").replace(/"/g, '""') + '"';
    const rows = plan.slots.map((s) => [ymd(s.date), WD[(s.date.getDay() + 6) % 7], s.ch.name, s.ch.format, s.pillar ? s.pillar.name : "", s.topic ? s.topic.title : ""].map(q).join(","));
    return "\ufeff" + ["日期", "星期", "平台", "形式", "内容支柱", "选题"].map(q).join(",") + "\n" + rows.join("\n");
  }
  PB.calendarMarkdown = toMarkdown;

  PB.tools.calendar = {
    mount(shell) {
      const ex = PB.content.tools.calendar.example;
      const formats = PB.content.tools.calendar.formats;
      const isExample = () => !PB.store.has("calendar");
      const fresh = () => ({
        pillars: ex.pillars.map((p, i) => ({ id: "p" + i, name: p.name, ratio: p.ratio })),
        channels: ex.channels.map((c, i) => ({ id: "c" + i, name: c.name, perWeek: c.perWeek, format: c.format })),
        start: ymd(nextMonday()),
        topics: ex.topics.map((t, i) => ({ id: "t" + i, title: t.title, pillar: t.pillar, impact: t.impact, confidence: t.confidence, ease: t.ease, done: false }))
      });
      const get = () => PB.store.get("calendar", fresh());
      const save = (st) => PB.store.set("calendar", st);
      const setup = h("div", { class: "tool-split" });
      const calBox = h("div", { class: "panel" });
      const topicBox = h("div", { class: "panel" });
      const ai = PB.aiPanel("Claude 生成的选题");
      shell.body.append(setup, calBox, h("div", { class: "tool-split" }, topicBox, ai.el));
      const pcIndex = (st, name) => Math.max(0, st.pillars.findIndex((p) => p.name === name)) % 6 + 1;

      function renderSetup() {
        const st = get();
        PB.clear(setup);
        PB.clear(shell.badges);
        if (isExample()) shell.badges.append(PB.exampleBadge("示例计划"));
        const pBox = h("div", { class: "panel" });
        const sum = st.pillars.reduce((n, p) => n + (+p.ratio || 0), 0);
        pBox.append(h("div", { class: "panel-title" }, h("span", { text: "内容支柱与占比" }), h("span", { class: "mono small" + (sum !== 100 ? " muted" : ""), text: "合计 " + sum + "%" + (sum !== 100 ? "（将按比例换算）" : "") })));
        st.pillars.forEach((p, i) => {
          const name = h("input", { class: "input", type: "text", value: p.name, placeholder: "支柱名称", "aria-label": "支柱名称" });
          name.addEventListener("change", () => { const cur = get(); const old = cur.pillars[i].name; cur.pillars[i].name = name.value.trim(); cur.topics.forEach((t) => { if (t.pillar === old) t.pillar = cur.pillars[i].name; }); save(cur); renderAll(); });
          const ratio = h("input", { class: "input num", type: "number", min: "0", max: "100", step: "5", value: String(p.ratio), "aria-label": "占比（%）" });
          ratio.addEventListener("change", () => { const cur = get(); cur.pillars[i].ratio = PB.clamp(+ratio.value || 0, 0, 100); save(cur); renderAll(); });
          const del = h("button", { class: "btn sm ghost", type: "button", "aria-label": "删除支柱", disabled: st.pillars.length <= 1 }, PB.icon("x", "sm"));
          del.addEventListener("click", () => { const cur = get(); cur.pillars.splice(i, 1); save(cur); renderAll(); });
          pBox.append(h("div", { class: "pillar-row" }, h("div", { style: { display: "flex", gap: "8px", alignItems: "center" } }, h("i", { class: "pc-dot", style: { background: "var(--pc-" + ((i % 6) + 1) + ")" } }), name), ratio, del));
        });
        const addP = h("button", { class: "btn sm", type: "button", disabled: st.pillars.length >= 6 }, PB.icon("plus", "sm"), "添加支柱");
        addP.addEventListener("click", () => { const cur = get(); cur.pillars.push({ id: PB.uid("p"), name: "新支柱" + (cur.pillars.length + 1), ratio: 10 }); save(cur); renderAll(); });
        pBox.append(h("div", { class: "btn-row" }, addP));

        const cBox = h("div", { class: "panel" });
        cBox.append(h("div", { class: "panel-title", text: "发布节奏" }));
        const dl = h("datalist", { id: "pb-plat-names" }, PB.content.tools.platforms.map((p) => h("option", { value: p.name })));
        cBox.append(dl);
        cBox.append(h("div", { class: "channel-row small muted" }, h("span", { text: "平台" }), h("span", { text: "每周条数" }), h("span", { text: "形式" }), h("span", {})));
        st.channels.forEach((c, i) => {
          const name = h("input", { class: "input", type: "text", value: c.name, list: "pb-plat-names", placeholder: "平台", "aria-label": "平台" });

/* ==== 46-tool-roadmap.js ==== */
/* 46-tool-roadmap.js — 90 天计划：12 周甘特条 + 当前周标记 + 四阶段任务清单。
   存储键 roadmap = { start: "YYYY-MM-DD"|null, done: { <taskId>: 1 } } */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;

  PB.roadmapWeek = function roadmapWeek(start) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(start || "");
    if (!m) return 1;
    const s = new Date(+m[1], +m[2] - 1, +m[3]);
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - s) / (7 * 864e5)) + 1;
  };

  PB.tools.roadmap = {
    mount(shell) {
      const phases = PB.content.tools.roadmap.phases;
      const get = () => PB.store.get("roadmap", { start: null, done: {} });
      const save = (st) => PB.store.set("roadmap", st);
      const head = h("div", { class: "panel tint" });
      const grid = h("div", { class: "phase-grid" });
      shell.body.append(head, grid);

      function render() {
        const st = get();
        const start = st.start || PB.today();
        const week = PB.roadmapWeek(start);
        const total = phases.reduce((n, p) => n + p.tasks.length, 0);
        const done = phases.reduce((n, p) => n + p.tasks.filter((t) => st.done[t.id]).length, 0);
        PB.clear(head);
        const dateId = PB.uid("rm-start");
        const date = h("input", { class: "input", type: "date", id: dateId, value: start, style: { maxWidth: "180px" } });
        date.addEventListener("change", () => { const cur = get(); cur.start = date.value || null; save(cur); render(); });
        const weekText = week < 1 ? "计划将于 " + start + " 开始" : week > 12 ? "12 周已结束，记得写复盘、做一次体检" : "现在是第 " + week + " 周";
        head.append(h("div", { class: "result-head" },
          h("div", {}, h("div", { class: "small muted", text: "总进度" }), h("div", { class: "big-number", text: Math.round((done / total) * 100) + "%" }, h("span", { class: "unit", text: done + " / " + total + " 项" }))),
          h("div", { style: { display: "grid", gap: "6px", justifyItems: "end" } }, h("strong", { text: weekText }), h("div", { class: "btn-row" }, h("label", { for: dateId, class: "small muted", text: "开始日期" }), date))));
        const gantt = h("div", { class: "gantt", role: "img", "aria-label": "12 周路线图，" + weekText });
        for (let w = 1; w <= 12; w++) gantt.append(h("span", { class: "gantt-wk", style: { left: ((w - 0.5) / 12) * 100 + "%", transform: "translateX(-50%)" }, text: "W" + w }));
        phases.forEach((p) => {
          const pd = p.tasks.filter((t) => st.done[t.id]).length;
          gantt.append(h("div", { class: "gantt-bar " + p.stage, style: { gridColumn: p.weeks[0] + " / " + (p.weeks[1] + 1) }, title: p.name + "：完成 " + pd + "/" + p.tasks.length },
            h("i", { style: { width: (pd / p.tasks.length) * 100 + "%" } }), h("span", { text: p.name + " " + pd + "/" + p.tasks.length })));
        });
        if (week >= 1 && week <= 12) gantt.append(h("span", { class: "gantt-now", "data-label": "本周", style: { left: "calc(" + ((week - 0.5) / 12) * 100 + "% - 1px)" } }));
        head.append(gantt);
        PB.clear(grid);
        phases.forEach((p) => {
          const pd = p.tasks.filter((t) => st.done[t.id]).length;
          const isCur = week >= p.weeks[0] && week <= p.weeks[1];
          grid.append(h("div", { class: "phase" + (isCur ? " current" : "") },
            h("div", { class: "phase-head" }, h("strong", {}, h("i", { class: "swatch " + p.stage, style: { width: "10px", height: "10px", borderRadius: "3px", display: "inline-block" } }), p.name, isCur ? h("span", { class: "badge build", text: "进行中" }) : null),
              h("span", { class: "muted", text: "第 " + p.weeks[0] + "–" + p.weeks[1] + " 周 · " + pd + "/" + p.tasks.length })),
            p.tasks.map((t) => {
              const id = "rm-" + t.id;
              const cb = h("input", { type: "checkbox", id, checked: !!st.done[t.id] });
              cb.addEventListener("change", () => { const cur = get(); const d2 = Object.assign({}, cur.done); if (cb.checked) d2[t.id] = 1; else delete d2[t.id]; cur.done = d2; if (!cur.start) cur.start = start; save(cur); render(); });
              return h("label", { class: "task" + (st.done[t.id] ? " on" : ""), for: id }, cb, h("span", {}, h("span", { class: "task-text", text: t.text }), t.link ? h("a", { href: "#" + t.link, text: "→" , "aria-label": "相关内容：" + PB.routeTitle(t.link) }) : null));
            })));
        });
        shell.actions.textContent = "";
        shell.actions.append(PB.confirmBtn("重置进度", "再点一次重置", () => { save({ start: st.start, done: {} }); render(); }));
      }

    }
  };
})();

/* ==== 47-tool-metrics.js ==== */
/* 47-tool-metrics.js — 指标仪表盘：按月记录 6 项指标 → 指标卡（环比）+ 小多图 + 可编辑数据表 + 北极星指标。
   存储键 metrics = { rows: [{month:"YYYY-MM", <fieldId>: number|null}], star: fieldId }。
   每个指标单独成图（不同量纲不共用坐标轴）。 */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;

  function nextMonth(m) {
    const mm = /^(\d{4})-(\d{2})$/.exec(m || "");
    const d = mm ? new Date(+mm[1], +mm[2], 1) : new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  const monthLabel = (m) => { const mm = /^(\d{4})-(\d{2})$/.exec(m || ""); return mm ? +mm[2] + "月" : m; };

  PB.tools.metrics = {
    mount(shell) {
      const cfg = PB.content.tools.metrics;
      const isExample = () => !PB.store.has("metrics");
      const get = () => PB.store.get("metrics", { rows: JSON.parse(JSON.stringify(cfg.example)), star: "opportunities" });
      const save = (st) => { st.rows.sort((a, b) => String(a.month).localeCompare(String(b.month))); PB.store.set("metrics", st); };
      const tiles = h("div", { class: "stat-grid" });
      const charts = h("div", { class: "small-multiples" });
      const table = h("div", { class: "panel" });
      shell.body.append(tiles, charts, table);

      function render() {
        const st = get();
        const rows = st.rows;
        PB.clear(shell.badges);
        if (isExample()) shell.badges.append(PB.exampleBadge("示例数据"));
        PB.clear(tiles); PB.clear(charts);
        if (!rows.length) {
          tiles.append(h("div", { class: "empty", style: { gridColumn: "1 / -1" }, text: "还没有数据。点击下方“添加月份”，记录第一个月的关注者、订阅、机会与收入。" }));
        }
        const last = rows[rows.length - 1], prev = rows[rows.length - 2];
        if (last) cfg.fields.forEach((f) => {
          const v = last[f.id], pv = prev ? prev[f.id] : null;
          let delta = null, cls = "flat";
          if (v !== null && v !== undefined && pv !== null && pv !== undefined && pv !== 0) { delta = ((v - pv) / Math.abs(pv)) * 100; cls = delta > 0.5 ? "up" : delta < -0.5 ? "down" : "flat"; }
          else if (pv === 0 && v > 0) { cls = "up"; }
          const star = st.star === f.id;
          const tile = h("button", { type: "button", class: "stat selectable" + (star ? " star" : ""), "aria-pressed": star ? "true" : "false", title: "设为北极星指标" },
            h("span", { class: "stat-label" }, h("span", { text: f.name }), star ? h("span", { class: "badge build" }, PB.icon("star", "sm"), "北极星") : null),
            h("span", { class: "stat-value" }, f.id === "revenue" ? PB.money(v || 0) : PB.fmt(v), f.unit && f.id !== "revenue" ? h("span", { class: "unit", text: f.unit }) : null),
            h("span", { class: "delta " + cls, text: delta === null ? (pv === 0 && v > 0 ? "较上月：从 0 起步" : "较上月：—") : "较上月 " + (delta > 0 ? "+" : "") + delta.toFixed(1) + "%" }));
          tile.addEventListener("click", () => { const cur = get(); cur.star = f.id; save(cur); render(); });
          tiles.append(tile);
        });
        if (rows.length) cfg.fields.forEach((f) => {
          charts.append(h("div", { class: "sm-chart" + (st.star === f.id ? " star" : "") },
            h("div", { class: "sm-chart-title" }, h("span", { text: f.name }), h("span", { class: "muted", text: monthLabel(rows[0].month) + "–" + monthLabel(rows[rows.length - 1].month) })),
            PB.lineChart({ title: f.name, unit: f.unit, points: rows.map((r) => ({ label: monthLabel(r.month), full: r.month, value: r[f.id] })) })));
        });
        renderTable(st);
      }

      function renderTable(st) {
        PB.clear(table);
        table.append(h("div", { class: "panel-title" }, h("span", { text: "数据表（直接编辑，自动保存）" }),
          h("span", { class: "btn-row" }, PB.copyBtn(() => toCsv(st), "复制 CSV"), PB.saveBtn("保存 CSV", "brand-metrics.csv", () => toCsv(get()), "text/csv"))));
        const thead = h("tr", {}, h("th", { text: "月份" }), cfg.fields.map((f) => h("th", { text: f.name + (f.unit ? "（" + f.unit + "）" : "") })), h("th", {}));
        const tbody = h("tbody", {});
        st.rows.forEach((r, ri) => {
          const month = h("input", { type: "month", value: r.month, "aria-label": "月份" });
          month.addEventListener("change", () => { const cur = get(); cur.rows[ri].month = month.value; save(cur); render(); });
          const cells = cfg.fields.map((f) => {
            const inp = h("input", { type: "number", step: f.unit === "%" ? "0.1" : "1", value: r[f.id] === null || r[f.id] === undefined ? "" : String(r[f.id]), "aria-label": r.month + " " + f.name });
            inp.addEventListener("change", () => { const cur = get(); cur.rows[ri][f.id] = inp.value === "" ? null : +inp.value; save(cur); render(); });
            return h("td", {}, inp);
          });
          const del = h("button", { class: "btn sm ghost", type: "button", "aria-label": "删除 " + r.month }, PB.icon("x", "sm"));
          del.addEventListener("click", () => { const cur = get(); cur.rows.splice(ri, 1); save(cur); render(); });
          tbody.append(h("tr", {}, h("td", {}, month), cells, h("td", {}, del)));
        });
        table.append(h("div", { class: "table-wrap" }, h("table", { class: "data-table" }, h("thead", {}, thead), tbody)));
        const add = h("button", { class: "btn sm primary", type: "button" }, PB.icon("plus", "sm"), "添加月份");
        add.addEventListener("click", () => {
          const cur = get();
          const lastRow = cur.rows[cur.rows.length - 1];
          const row = { month: lastRow ? nextMonth(lastRow.month) : PB.today().slice(0, 7) };
          cfg.fields.forEach((f) => { row[f.id] = null; });
          cur.rows.push(row);
          save(cur); render();
        });
        table.append(h("div", { class: "btn-row" }, add,
          isExample() ? h("button", { class: "btn sm", type: "button", onclick: () => { save({ rows: [], star: get().star }); render(); } }, "清空示例，开始记录") : PB.confirmBtn("清空数据", "再点一次清空", () => { save({ rows: [], star: get().star }); render(); }),
          h("span", { class: "note", text: "点击上方指标卡可以设定北极星指标。" })));
      }
      function toCsv(st) {
        const head = ["月份"].concat(cfg.fields.map((f) => f.name));
        return head.join(",") + "\n" + st.rows.map((r) => [r.month].concat(cfg.fields.map((f) => (r[f.id] === null || r[f.id] === undefined ? "" : r[f.id]))).join(",")).join("\n");
      }
      render();
    }
  };

/* ==== 49-tool-money.js ==== */
/* 49-tool-money.js — 变现计算器：A. 铁杆粉丝测算（正算 + 反算）；B. 价值阶梯月收入估算。
   存储键 money = { fans, spend, target, reach, tiers: [{name, price, rate}] } */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;

  PB.moneyLadder = function moneyLadder(m) {
    let base = +m.reach || 0;
    return (m.tiers || []).map((t) => {
      const buyers = base * ((+t.rate || 0) / 100);
      const revenue = buyers * (+t.price || 0);
      base = buyers;
      return { t, buyers, revenue };
    });
  };

  PB.tools.money = {
    mount(shell) {
      const def = PB.content.tools.money;
      const isExample = () => !PB.store.has("money");
      const get = () => PB.store.get("money", { fans: def.fans, spend: def.spend, target: 300000, reach: def.reach, tiers: JSON.parse(JSON.stringify(def.tiers)) });

      const ladderBox = h("div", { class: "panel" });

        range.addEventListener("input", () => { num.value = range.value; apply(range.value); });
        num.addEventListener("change", () => { range.value = String(PB.clamp(+num.value || 0, min, max)); apply(num.value); });
        return h("div", { class: "field" }, h("label", { for: id, class: "field-label", text: label }), h("div", { style: { display: "flex", gap: "10px", alignItems: "center" } }, range, num));
      }

      function renderFans() {
        PB.clear(fansBox);
        const out = h("div", { "aria-live": "polite", style: { display: "grid", gap: "6px" } });
        const reverse = h("div", { class: "rec" });
        const update = () => {
          const st = get();
          const annual = st.fans * st.spend;
          PB.clear(out).append(
            h("div", { class: "small muted", text: "预计年收入" }),

          target.addEventListener("change", () => { const cur = get(); cur.target = Math.max(0, +target.value || 0); save(cur); update(); });
          PB.clear(reverse).append(h("label", { for: tId, class: "field-label", text: "反过来算：想要的年收入" }), target,
            h("p", { class: "small", html: PB.md("按每人每年 " + PB.money(st.spend) + " 计算，需要 **" + PB.fmt(need) + "** 位铁杆粉丝。") }));
          PB.clear(shell.badges);
          if (isExample()) shell.badges.append(PB.exampleBadge("示例参数"));
        };
        fansBox.append(h("div", { class: "panel-title", text: "A. 铁杆粉丝测算" }),
          numField("铁杆粉丝数", "fans", 100, 10000, 50, update),
          numField("每人每年在你身上的花费（元）", "spend", 50, 5000, 10, update),
          out, reverse,
          h("p", { class: "note", text: "Kevin Kelly 的原始设定是 1000 人 × 每年 100 美元。关键是“直接关系”：你能直接联系到他们，他们也愿意持续为你付费。" }));
        update();
      }

      function renderLadder() {
        PB.clear(ladderBox);
        const st = get();
        const rows = h("div", { style: { display: "grid", gap: "8px" } });
        const result = h("div", { "aria-live": "polite", style: { display: "grid", gap: "10px" } });
        const reachId = PB.uid("mn-reach");

        const calc = () => {

          res.forEach((r, i) => {
            const name = h("input", { class: "input", type: "text", value: r.t.name, "aria-label": "层级名称" });
            name.addEventListener("change", () => { const c = get(); c.tiers[i].name = name.value; save(c); calc(); });
            const price = h("input", { class: "input num", type: "number", min: "0", value: String(r.t.price), "aria-label": r.t.name + " 价格" });
            price.addEventListener("change", () => { const c = get(); c.tiers[i].price = Math.max(0, +price.value || 0); save(c); calc(); });
            const rate = h("input", { class: "input num", type: "number", min: "0", max: "100", step: "0.5", value: String(r.t.rate), "aria-label": r.t.name + " 转化率" });

            rows.append(h("div", { class: "tier-row" }, name, price, rate, h("span", { class: "tier-out", text: PB.fmt(r.buyers, 1) + " 人 · " + PB.money(r.revenue) })));
          });
          const total = res.reduce((n, r) => n + r.revenue, 0);
          PB.clear(result).append(
            h("div", { class: "result-head" }, h("div", {}, h("div", { class: "small muted", text: "预计月收入" }), h("div", { class: "big-number", text: PB.money(total) })), h("div", { class: "small muted", style: { textAlign: "right" }, text: "约合年收入 " + PB.money(total * 12) })),
            PB.hbars(res.filter((r) => r.t.price > 0).map((r) => ({ label: r.t.name, value: r.revenue, display: PB.money(r.revenue) }))),
            h("p", { class: "note", text: "每一层的转化率以上一层的人数为基数：月触达 → 关注/订阅 → 引流品 → 核心产品 → 高端服务。数字只用于理解结构，真实转化率需要用你自己的数据校准。" }));
        };
        ladderBox.append(h("div", { class: "panel-title", text: "B. 价值阶梯月收入" }),
          h("div", { class: "field" }, h("label", { for: reachId, class: "field-label", text: "每月触达人数（内容覆盖的独立用户）" }), reach),
          rows, result,
          h("div", { class: "btn-row" }, PB.confirmBtn("恢复默认参数", "再点一次恢复", () => { PB.store.remove("money"); renderFans(); renderLadder(); })));
        calc();
      }

      renderFans();
      renderLadder();
    }
  };
})();

/* ==== 50-tool-advisor.js ==== */
/* 50-tool-advisor.js — 品牌顾问：带着用户的品牌档案向 Claude 提问（流式输出、可停止）。
   仅在 Claude 中打开、且 sample 能力可用时出现；其他环境显示说明。
   存储键 advisor = { turns: [{role:"user"|"assistant", content}], withProfile: true }（保留最近 30 条） */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;

  PB.tools.advisor = {
    mount(shell) {
      const cfgA = PB.content.tools.ai;
      const get = () => PB.store.get("advisor", { turns: [], withProfile: true });
      const save = (st) => { st.turns = st.turns.slice(-30); PB.store.set("advisor", st); };
      const unavailable = h("div", { class: "unavailable", "data-cap": "no-sample" },
        h("strong", { text: "在 Claude 中打开本页面时可用" }),
        h("span", { text: "品牌顾问会调用你自己的 Claude 账户回答问题，并自动带上你在定位画布、品牌原型、平台选择器和体检中填写的信息。独立托管的版本不包含这项功能，其余工具都可以正常使用。" }),
        h("span", { class: "small muted", html: PB.md("想先整理自己的档案？去 [[tools.canvas|定位画布]] 和 [[tools.audit|品牌体检]]。") }));
      const chat = h("div", { class: "chat", "data-cap": "sample", hidden: true });
      shell.body.append(unavailable, chat);

      const log = h("div", { class: "chat-log", "aria-live": "polite" });
      const inputId = PB.uid("adv-in");
      const input = h("textarea", { class: "textarea", id: inputId, rows: "2", placeholder: "问一个关于你个人品牌的问题，Enter 发送，Shift + Enter 换行", maxlength: "2000" });
      const send = h("button", { class: "btn primary", type: "button" }, PB.icon("send", "sm"), "发送");
      const stop = h("button", { class: "btn", type: "button", hidden: true }, PB.icon("stop", "sm"), "停止");
      const withProfileId = PB.uid("adv-pf");
      const withProfile = h("input", { type: "checkbox", id: withProfileId, checked: get().withProfile !== false });
      withProfile.addEventListener("change", () => { const st = get(); st.withProfile = withProfile.checked; save(st); });
      const sugg = h("div", { class: "chips" });
      const err = h("div", { class: "ai-error", hidden: true });
      chat.append(log, sugg, err,
        h("div", { class: "chat-input" }, h("div", { class: "field" }, h("label", { for: inputId, class: "sr-only", text: "你的问题" }), input), h("div", { class: "btn-row" }, stop, send)),
        h("div", { class: "btn-row" },
          h("label", { for: withProfileId, class: "small", style: { display: "inline-flex", gap: "6px", alignItems: "center" } }, withProfile, "附带我的品牌档案"),
          PB.confirmBtn("清空对话", "再点一次清空", () => { const st = get(); st.turns = []; save(st); render(); }),
          h("span", { class: "note", text: "每次提问会消耗你自己的 Claude 用量；首次使用时会请求授权。" })));

      let ctl = null, busy = false;
      function bubble(role, text) {
        const el = h("div", { class: "msg " + role });
        if (role === "assistant") el.innerHTML = PB.mdBlock(text); else el.textContent = text;
        return el;
      }
      function render() {
        const st = get();
        PB.clear(log);
        if (!st.turns.length) log.append(h("div", { class: "msg assistant", html: PB.mdBlock("你好！我可以帮你打磨定位、构思选题、规划平台和变现。你可以直接提问，或者点下面的常见问题开始。") }));
        st.turns.forEach((t) => log.append(bubble(t.role, t.content)));
        PB.clear(sugg);
        if (!st.turns.length) cfgA.suggestions.forEach((q) => sugg.append(h("button", { class: "chip", type: "button", text: q, onclick: () => { input.value = q; ask(); } })));
        log.scrollTop = log.scrollHeight;
      }
      async function ask() {
        const q = input.value.trim();
        if (!q || busy || !PB.cap.sample) return;
        busy = true; err.hidden = true;
        const st = get();
        st.turns.push({ role: "user", content: q });
        save(st);
        input.value = "";
        render();
        const live = h("div", { class: "msg assistant" }, h("span", { class: "ai-thinking", text: "Claude 正在思考……" }));
        log.append(live); log.scrollTop = log.scrollHeight;
        const rules = PB.fill(cfgA.advisor, { profile: withProfile.checked ? PB.profileText() : "（用户选择不附带档案）" });
        const turns = [{ role: "user", content: rules }].concat(st.turns.slice(-12));
        ctl = new AbortController();
        send.disabled = true; stop.hidden = false;
        try {
          const res = await PB.cap.sample(turns, { cache: false, signal: ctl.signal, onText: ({ text }) => { live.innerHTML = PB.mdBlock(text); log.scrollTop = log.scrollHeight; } });
          const cur = get();
          cur.turns.push({ role: "assistant", content: res.text + (res.truncated ? "\n\n（回答被截断，可以让我分段继续。）" : "") });
          save(cur);
        } catch (e) {
          if (e && e.text && e.code !== "refused") { const cur = get(); cur.turns.push({ role: "assistant", content: e.text + "\n\n（回答中断）" }); save(cur); }
          if (!e || e.code !== "cancelled") { err.textContent = PB.aiErrorText(e); err.hidden = false; PB.aiHandleError(e); }
        } finally {
          busy = false; ctl = null; send.disabled = false; stop.hidden = true;
          render();
        }
      }
      send.addEventListener("click", ask);
      stop.addEventListener("click", () => { if (ctl) ctl.abort(); });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
      render();
    }
  };
})();

/* ==== 51-tool-plan.js ==== */
/* 51-tool-plan.js — 我的方案：把各工具的数据汇总成 Markdown 品牌战略书；数据备份、导入与清空。 */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;

  PB.buildPlanMarkdown = function buildPlanMarkdown() {
    const C = PB.content, T = C.tools, S = PB.store;
    const L = [];
    const todo = (tool, route) => "> 尚未填写，去「" + tool + "」完成（本页路径：#" + route + "）。";
    L.push("# 个人品牌战略书", "", "> 生成于 " + PB.today() + " · 来源：" + C.site.title + " v" + C.site.version, "");

    L.push("## 1. 定位");
    const cv = S.get("canvas");
    const filled = cv && cv.fields && T.canvas.fields.some((f) => (cv.fields[f.id] || "").trim());
    if (filled) {
      T.canvas.fields.forEach((f) => { const v = (cv.fields[f.id] || "").trim(); if (v) L.push("- **" + f.label + "**：" + v); });
      L.push("");
      const outs = PB.canvasOutputs(cv.fields, false);

    } else L.push("", todo("定位画布", "tools.canvas"), "");

    L.push("## 2. 品牌个性");
    const ar = S.get("archetype");
    if (ar && ar.primary) {
      const p = T.archetypes.find((a) => a.id === ar.primary), s2 = T.archetypes.find((a) => a.id === ar.secondary);
      L.push("- **品牌原型**：" + p.name + (s2 ? " + " + s2.name : ""), "- **语调关键词**：" + p.voice.concat(s2 ? s2.voice : []).join("、"), "- **内容方向**：" + p.content + (s2 ? "；" + s2.content : ""), "- **需要警惕**：" + p.watch + (s2 ? "；" + s2.watch : ""), "");
    } else L.push("", todo("品牌原型", "tools.archetype"), "");

    L.push("## 3. 领域评估");
    const ni = S.get("niche");
    if (ni && ni.topics && ni.topics.length) {
      L.push("", "| 领域 | 加权得分 |", "|---|---|");
      ni.topics.map((t) => ({ t, s: PB.nicheScore(t) })).sort((a, b) => b.s - a.s).forEach((x) => L.push("| " + (x.t.name || "（未命名）") + " | " + x.s + " |"));
      L.push("");
    } else L.push("", todo("领域评估", "tools.niche"), "");

    L.push("## 4. 平台策略");
    const pl = S.get("platform");
    if (pl) {
      const r = PB.platformRank(pl), rented = r.filter((x) => !x.owned), owned = r.filter((x) => x.owned)[0];
      if (rented[0]) L.push("- **主阵地**：" + rented[0].p.name + "（匹配度 " + rented[0].score + "）——" + rented[0].p.strengths);
      if (rented[1]) L.push("- **分发阵地**：" + rented[1].p.name + "（匹配度 " + rented[1].score + "）");
      if (owned) L.push("- **自有阵地**：" + owned.p.name + "——" + owned.p.strengths);
      L.push("");
    } else L.push("", todo("平台选择器", "tools.platform"), "");

    L.push("## 5. 内容策略");
    const cal = S.get("calendar");
    if (cal) {
      L.push("- **内容支柱**：" + cal.pillars.map((p) => p.name + " " + p.ratio + "%").join("、"));
      L.push("- **发布节奏**：" + cal.channels.map((c) => (c.name || "平台") + " 每周 " + c.perWeek + " 条" + c.format).join("；"));
      const top = cal.topics.filter((t) => !t.done).sort((a, b) => PB.ice(b) - PB.ice(a)).slice(0, 10);
      if (top.length) { L.push("", "### 选题池（按 ICE 排序）", ""); top.forEach((t, i) => L.push((i + 1) + ". " + t.title + "（" + t.pillar + "，ICE " + PB.ice(t) + "）")); }

    } else L.push("", todo("90 天计划", "tools.roadmap"), "");

    L.push("## 7. 品牌体检");
    const au = S.get("audit");
    if (au && au.history && au.history.length) {
      const last = au.history[au.history.length - 1];
      L.push("- 最近一次：" + last.date + "，" + last.total + " 分（" + last.level + "）", "", "| 维度 | 得分（满分 5） |", "|---|---|");
      T.audit.dimensions.forEach((d) => L.push("| " + d.name + " | " + (last.scores[d.id] ? last.scores[d.id].toFixed(1) : "—") + " |"));
      if (au.history.length > 1) { const first = au.history[0]; L.push("", "- 与首次（" + first.date + "，" + first.total + " 分）相比：" + (last.total - first.total >= 0 ? "+" : "") + (last.total - first.total) + " 分"); }
      L.push("");
    } else L.push("", todo("品牌体检（完成后点“保存本次结果”）", "tools.audit"), "");

    L.push("## 8. 指标");
    const me = S.get("metrics");
    if (me && me.rows && me.rows.length) {
      const f = T.metrics.fields;
      L.push("", "| 月份 | " + f.map((x) => x.name).join(" | ") + " |", "|" + "---|".repeat(f.length + 1));
      me.rows.forEach((r) => L.push("| " + r.month + " | " + f.map((x) => (r[x.id] === null || r[x.id] === undefined ? "" : r[x.id])).join(" | ") + " |"));
      const star = f.find((x) => x.id === me.star);
      if (star) L.push("", "- 北极星指标：" + star.name);
      L.push("");
    } else L.push("", todo("指标仪表盘", "tools.metrics"), "");

    L.push("## 9. 变现规划");
    const mo = S.get("money");
    if (mo) {
      L.push("- 铁杆粉丝测算：" + PB.fmt(mo.fans) + " 人 × 每年 " + PB.money(mo.spend) + " = " + PB.money(mo.fans * mo.spend) + " / 年");
      const lad = PB.moneyLadder(mo);
      L.push("- 价值阶梯（月触达 " + PB.fmt(mo.reach) + " 人）：");
      lad.forEach((x) => L.push("  - " + x.t.name + "：¥" + x.t.price + "，转化 " + x.t.rate + "% → " + PB.fmt(x.buyers, 1) + " 人，" + PB.money(x.revenue) + " / 月"));
      L.push("- 合计约 " + PB.money(lad.reduce((n, x) => n + x.revenue, 0)) + " / 月", "");
    } else L.push("", todo("变现计算器", "tools.money"), "");

    L.push("## 10. 行动清单完成情况", "");
    C.site.chapters.forEach((cid) => C.chapters[cid].sections.forEach((s) => s.blocks.forEach((b) => {
      if (b.type !== "checklist") return;
      const st = S.get("check:" + b.id, {});
      const n = Object.keys(st).length;
      if (n) L.push("- " + C.chapters[cid].title + " · " + s.title + " · " + b.title + "：" + n + " / " + b.items.length);
    })));
    L.push("", "---", "", "*本文件由「" + C.site.title + "」自动生成，可作为品牌手册初稿，交给团队或 AI 工具保持输出一致。*");
    return L.join("\n");
  };

  PB.tools.plan = {
    mount(shell) {
      const preview = h("div", { class: "plan-preview" });
      const raw = h("textarea", { class: "textarea copy-area", readonly: true, "aria-label": "Markdown 原文" });
      const dataBox = h("div", { class: "panel" });
      shell.body.append(
        h("div", { class: "btn-row" },
          h("button", { class: "btn primary sm", type: "button", onclick: () => PB.copy(raw.value, raw) }, PB.icon("copy", "sm"), "复制 Markdown"),
          PB.saveBtn("保存为 .md", () => "个人品牌战略书-" + PB.today() + ".md", () => raw.value, "text/markdown"),
          h("button", { class: "btn sm ghost", type: "button", onclick: render }, PB.icon("refresh", "sm"), "重新生成")),
        h("div", { class: "tool-split wide-left" }, preview, h("div", { style: { display: "grid", gap: "12px", alignContent: "start" } }, h("details", { class: "panel" }, h("summary", { class: "panel-title", style: { cursor: "pointer" } }, "Markdown 原文"), raw), dataBox)));

      function render() {
        const md = PB.buildPlanMarkdown();
        raw.value = md;
        preview.innerHTML = PB.mdBlock(md);
      }

      function renderData() {
        PB.clear(dataBox);
        const st = PB.store.status;
        const keys = Object.keys(PB.store.all().items);
        dataBox.append(h("div", { class: "panel-title", text: "数据管理" }),
          h("p", { class: "small", html: PB.md("当前保存位置：**" + (st.mode === "cloud" ? "本浏览器 + 你的 Claude 账户（仅你可见）" : "本浏览器") + "**。共 " + keys.length + " 项数据，约 " + Math.ceil(PB.store.size() / 1024) + " KB。") }));
        if (st.remoteError) dataBox.append(h("p", { class: "note", text: st.remoteError }));
        const exportText = () => JSON.stringify({ app: "personal-brand-flywheel", exported: new Date().toISOString(), data: PB.store.all() }, null, 2);
        const exportArea = h("textarea", { class: "textarea copy-area", readonly: true, hidden: true, "aria-label": "导出的数据" });
        dataBox.append(h("div", { class: "btn-row" },
          h("button", { class: "btn sm", type: "button", onclick: () => { exportArea.value = exportText(); exportArea.hidden = false; PB.copy(exportArea.value, exportArea); } }, PB.icon("copy", "sm"), "复制备份（JSON）"),
          PB.saveBtn("保存备份文件", () => "personal-brand-backup-" + PB.today() + ".json", exportText, "application/json")), exportArea);
        const fileId = PB.uid("imp");
        const file = h("input", { type: "file", id: fileId, accept: ".json,application/json", class: "sr-only" });
        const paste = h("textarea", { class: "textarea", rows: "3", placeholder: "或把备份 JSON 粘贴到这里", "aria-label": "粘贴备份 JSON" });
        const msg = h("p", { class: "note", "aria-live": "polite" });
        const doImport = (text) => {
          try {
            const obj = JSON.parse(text);
            const data = obj && obj.data && obj.data.items ? obj.data : obj && obj.items ? obj : null;
            if (!data) throw new Error("格式不对");
            PB.store.replaceAll(data);
            msg.textContent = "已导入 " + Object.keys(data.items).length + " 项数据。";
            PB.toast("导入成功");
          } catch (e) { msg.textContent = "导入失败：请确认这是从本页面导出的备份文件（JSON）。"; }
        };
        file.addEventListener("change", () => { const f = file.files && file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result || "")); r.readAsText(f); file.value = ""; });
        dataBox.append(h("div", { class: "field-label", text: "导入备份（会覆盖当前数据）" }),
          h("div", { class: "btn-row" }, h("label", { for: fileId, class: "btn sm", tabindex: "0", role: "button", onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } } }, PB.icon("upload", "sm"), "选择文件"), file,
            h("button", { class: "btn sm", type: "button", onclick: () => { if (paste.value.trim()) doImport(paste.value); else paste.focus(); } }, "导入粘贴的内容")),
          paste, msg,
          h("div", { class: "field-label", text: "清空所有数据" }),
          h("div", { class: "btn-row" }, PB.confirmBtn("清空全部数据", "再点一次永久清空", () => { PB.store.clear(); PB.toast("已清空"); })),
          h("p", { class: "note", text: "清空会删除本浏览器和云端私有存储中的全部工具数据，无法恢复。建议先保存备份。" }));
      }
      render();
      renderData();
      PB.on("store:replaced", () => { if (document.body.contains(preview)) { render(); renderData(); } });
      PB.on("sync", () => { if (document.body.contains(dataBox)) renderData(); });
    }
  };
})();

/* ==== 90-main.js ==== */
/* 90-main.js — 启动：读取内嵌内容、连接外壳控件、初始化能力与路由。 */
(function () {
  "use strict";
  const PB = window.PB;

  function injectFonts() {
    // 异步加载标题与数据字体；被拦截时自动回退到系统字体，不阻塞渲染。
    try {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap";
      (document.head || document.documentElement).appendChild(l);
    } catch (e) { /* 忽略 */ }
  }

  const THEMES = [
    { id: "auto", icon: "auto", label: "主题：跟随系统" },
    { id: "light", icon: "sun", label: "主题：浅色" },
    { id: "dark", icon: "moon", label: "主题：深色" }
  ];
  function applyTheme(id) {
    const root = document.documentElement;
    if (id === "light" || id === "dark") root.setAttribute("data-theme", id);
    else root.removeAttribute("data-theme");
    const btn = document.getElementById("pb-theme");
    if (btn) {
      const t = THEMES.find((x) => x.id === id) || THEMES[0];
      btn.replaceChildren(PB.icon(t.icon));
      btn.setAttribute("aria-label", t.label);
      btn.title = t.label;
    }
  }

  function boot() {
    const raw = document.getElementById("pb-content");
    try { PB.content = JSON.parse(raw.textContent); } catch (e) {
      document.getElementById("view").textContent = "内容加载失败，请重新构建页面。";
      console.error(e);
      return;
    }
    injectFonts();
    const menu = document.getElementById("pb-menu");
    menu.replaceChildren(PB.icon("menu"));
    menu.addEventListener("click", PB.toggleRail);
    document.getElementById("pb-scrim").addEventListener("click", PB.closeRail);
    const sb = document.getElementById("pb-search-btn");
    sb.prepend(PB.icon("search", "sm"));
    sb.addEventListener("click", () => PB.search.open());
    const kbd = sb.querySelector(".kbd");
    if (kbd && !/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) kbd.textContent = "Ctrl K";
    // 独立托管时提供主题切换；在 Claude 中由宿主决定主题
    const themeBtn = document.getElementById("pb-theme");
    if (!PB.inClaude && themeBtn) {
      themeBtn.hidden = false;
      let cur = PB.prefs.get("theme", "auto");
      applyTheme(cur);
      themeBtn.addEventListener("click", () => {
        const i = THEMES.findIndex((t) => t.id === cur);
        cur = THEMES[(i + 1) % THEMES.length].id;
        PB.prefs.set("theme", cur);
        applyTheme(cur);
      });
    }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") PB.closeRail(); });
    window.addEventListener("hashchange", () => PB.navigate());
    PB.on("store:replaced", () => PB.navigate("keep"));
    PB.on("sync", () => PB.renderRail());
    PB.initCaps();
    PB.navigate(true);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
