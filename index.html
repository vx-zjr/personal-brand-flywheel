按钮；在公开在线版本中，同一位置的“去 GitHub 提建议”会打开一条预填好页面位置的 Issue。"},{"title":"智能体按手册处理","text":"维护者让 AI 智能体读取项目中的 agent.md，按其中的流程分诊、修改内容、校验并构建。"},{"title":"发布新版本","text":"更新推送到 GitHub 后会自动部署到公开在线版本，Artifact 版发布到同一个链接；版本号与更新日志同步记录在本页下方。"}]},{"type":"callout","tone":"note","title":"引用与准确性","text":"书籍、文章与模型均注明作者与年份；归属存疑的说法会标注“常被认为”。法规类信息标注生效日期，并按 90 天周期复审。发现错误，欢迎指出。"}]},"chapters":{"overview":{"id":"overview","title":"总览","en":"Overview","stage":"neutral","kicker":"先看全局","summary":"个人品牌是什么、为什么在 AI 时代更重要，以及贯穿全书的“飞轮模型”。","sequential":false,"reviewed":"2026-10-10","sections":[{"id":"what","title":"个人品牌是什么","en":"What it is","lead":"个人品牌不是自我包装，而是把声誉显性化：让对的人在需要的时候想到你、找到你、信任你。","reviewed":"2026-10-10","blocks":[{"type":"quote","text":"品牌，就是你不在场时，别人如何谈论你。","by":"常被认为出自 Jeff Bezos（出处存疑）"},{"type":"p","text":"更精确地说，个人品牌是你在**特定人群**心中，因为**特定价值**而被**记住、信任和推荐**的程度。每个人都已经有一个个人品牌，区别只在于：它是被你主动经营的，还是任由别人随意定义的。"},{"type":"cards","cols":3,"items":[{"title":"被记住","tag":"差异","text":"有清晰的定位和一致的识别，别人能用一句话说出“你是做什么的”。"},{"title":"被信任","tag":"证据","text":"有作品、案例、评价和长期一致的行为作为证据，而不只是自我宣称。"},{"title":"被推荐","tag":"传播","text":"你的价值容易被感知、容易被转述，别人愿意把你介绍给需要的人。"}]},{"type":"formula","text":"品牌资产 ≈ 对的人知道你 × 联想清晰 × 值得信任 × 愿意行动","note":"这是乘法：任何一项接近零，整体就接近零。“粉丝很多但没有机会”和“很专业但没人知道”，都不算强品牌。"},{"type":"pairs","left":"常见误区","right":"更准确的理解","items":[["个人品牌就是当网红","个人品牌是在你的领域里成为“被想起的人”。一千个精准关注者，常常胜过十万泛粉。"],["要打造一个完美人设","真实和一致比完美重要。人设与真实的落差越大，崩塌风险越高。"],["等我足够专业再开始","记录学习过程本身就是内容。比受众领先半步，就足以帮助后来者。"],["全平台同时铺开","先在一个主阵地单点突破，跑通之后再复用分发。"],["做个人品牌就是发内容","内容只是载体。作品、交付、关系和口碑同样构成品牌。"],["越快见效越好","品牌是复利游戏，通常需要 6–12 个月的稳定投入，才能看到明显的机会回报。"]]}]},{"id":"why","title":"为什么现在更重要","en":"Why now","lead":"AI 让内容变得廉价，让信任变得昂贵。“谁说的”正在变得和“说了什么”一样重要。","reviewed":"2026-10-10","volatile":true,"blocks":[{"type":"cards","cols":2,"items":[{"title":"内容通胀","text":"生成式 AI 让文章、图片和视频的生产成本趋近于零，同质内容泛滥。具名、可追溯、有真实经验的个人视角成了稀缺品。"},{"title":"AI 先于人认识你","text":"招聘方、客户和合作者越来越多地通过搜索引擎、AI 搜索摘要和 AI 助手了解一个人。你的数字足迹，决定了 AI 如何“介绍”你。"},{"title":"职业路径非线性","text":"跳槽、转型、自由职业和副业成为常态。个人品牌是随身携带的声誉资产，不会随某个雇主或平台消失。"},{"title":"兴趣推荐分发","text":"主流平台以兴趣推荐为主，好内容不必依赖粉丝基数也有机会被看见，小账号依然有窗口期。"},{"title":"信任决定溢价","text":"能力相近的两个人，更被信任的那个会拿到更好的机会、更高的定价和更快的成交。"},{"title":"机会的入口在变","text":"越来越多的工作机会、合作和客户来自内容与关系网络，而不只是简历投递和广告。"}]},{"type":"callout","tone":"insight","title":"扩大你的“运气表面积”","text":"Jason Roberts 提出过一个说法：运气的表面积 ≈ 你做的事 × 知道这件事的人数。只做不说，机会只能等别人偶然发现；个人品牌就是系统性地扩大这块表面积。"}]},{"id":"flywheel","title":"飞轮模型","en":"The flywheel","lead":"建立、维护、利用不是三件分开的事，而是一个互相加速的循环。","reviewed":"2026-10-10","blocks":[{"type":"diagram","kind":"flywheel","title":"个人品牌飞轮","caption":"每一次“利用”带来的案例、收入和关系，都会成为下一轮“建立”的证据和资源，飞轮因此越转越快。居中的是整个循环真正积累的东西：信任。","data":{"center":"信任","centerSub":"TRUST","stages":[{"id":"build","title":"建立","en":"BUILD","items":["认知自我","定位","识别","阵地","内容","启动"]},{"id":"maintain","title":"维护","en":"MAINTAIN","items":["一致性","社群关系","度量复盘","声誉","进化","可持续"]},{"id":"leverage","title":"利用","en":"LEVERAGE","items":["杠杆思维","职业","商业","变现","影响力","资产化"]}]}},{"type":"table","head":["阶段","核心问题","关键产出","北极星指标"],"rows":[["建立（0→1）","我是谁？为谁服务？凭什么是我？","定位陈述、品牌识别、主阵地、内容支柱","稳定发布的周数，前 100 位真实关注者"],["维护（1→N）","如何持续、可信、不走样？","内容系统、关系网络、指标仪表盘、危机预案","互动率，自有阵地订阅者增长"],["利用（N→价值）","如何把信任变成价值？","机会漏斗、价值阶梯、合作与影响力","主动找上门的机会数，品牌相关收入"]]}]},{"id":"howto","title":"如何使用本指南","en":"How to use","lead":"先体检，再按路线推进。每一章都配有可以直接上手的工具，填写的数据只保存在你自己的空间里。","reviewed":"2026-10-10","blocks":[{"type":"steps","items":[{"title":"做一次品牌体检","text":"7 个维度、21 道题，大约 5 分钟，看清你的长板和短板。入口：[[tools.audit|品牌体检]]。"},{"title":"选择你的角色路线","text":"职场人、开发者、自由职业者、创作者、创业者、学生、高管、转型者，各有不同的打法。入口：[[playbooks|角色路线]]。"},{"title":"按章节推进","text":"建立 → 维护 → 利用。每节末尾可以标记“已读”，左侧导航会显示进度。"},{"title":"用工具产出你的方案","text":"定位画布、平台选择器、内容日历、90 天计划……最后在 [[plan|我的方案]] 一键汇总成品牌战略书。"},{"title":"每季度复盘一次","text":"重新做体检、对比雷达图、更新定位。品牌和这份指南一样，需要持续迭代。"}]},{"type":"callout","tone":"tip","title":"时间不多？","text":"只做三件事：完成 [[tools.audit|品牌体检]]，用 [[tools.canvas|定位画布]] 写出一句话定位，再用 [[tools.roadmap|90 天计划]] 跟踪执行。"}]}]},"build":{"id":"build","title":"建立","en":"Build","stage":"build","kicker":"第一阶段 · 从 0 到 1","summary":"弄清“我是谁、为谁服务、凭什么是我”，搭好识别与阵地，开始稳定输出，完成冷启动。","sequential":true,"reviewed":"2026-10-10","sections":[{"id":"discover","title":"认知自我","en":"Discover","lead":"个人品牌是放大真实的你，而不是捏造一个新的你。先盘点你已经拥有的东西。","reviewed":"2026-10-10","blocks":[{"type":"p","text":"很多人卡在第一步：“我好像没什么特别的。”其实别人眼中的你，往往比你以为的更有辨识度。你需要的是一套系统的方法，把它挖出来、说清楚。"},{"type":"steps","items":[{"title":"经验资产盘点","text":"列出过去 5–10 年的职业经历、做成的项目、解决过的难题、跨界经历和独特的人生经历。重点写**结果**，以及过程中你做对了什么。"},{"title":"收集他人视角","text":"给 5–10 位同事、朋友或客户发三个问题：“你觉得我最擅长什么？”“遇到什么问题你会第一个想到我？”“用三个词形容我。”"},{"title":"记录高光与心流","text":"回忆那些让你忘记时间、做完仍有能量的事。它们往往指向你能长期坚持的方向。"},{"title":"澄清价值观","text":"从“自由、专业、创造、影响、真诚、成长、安全、财富……”中选出 3–5 个核心价值观。它们决定了你的品牌**不做什么**。"},{"title":"坚持反馈分析","text":"做重要决定时写下预期，9–12 个月后对照实际结果。这是 Peter Drucker 在《管理自己》（1999）中提出的方法，长期坚持能看清真正的优势。"}]},{"type":"diagram","kind":"venn","title":"品牌甜蜜区","caption":"四个圆的交集是品牌的“甜蜜区”。这个模型常被称为 Ikigai，但它其实是西方对日本概念的改编。把它当作思考工具即可，不必追求完美的交集。","data":{"center":"甜蜜区","circles":[{"label":"热爱","text":"你愿意长期投入、不计回报也想谈论的主题"},{"label":"擅长","text":"你比大多数人做得更好，或有独特经验的事"},{"label":"需要","text":"目标人群真正关心、正在寻找答案的问题"},{"label":"价值","text":"有人愿意为之付费，或能带来机会的方向"}]}},{"type":"table","caption":"常见的优势识别工具","head":["工具","适合做什么","使用提示"],"rows":[["CliftonStrengths（盖洛普优势测评）","识别天赋主题与工作方式","付费；建议与他人反馈交叉验证"],["VIA 品格优势测评","识别品格层面的核心优势","有免费版本"],["大五人格（Big Five）","了解稳定的性格特质","学术研究基础较好"],["MBTI 类测评","作为自我讨论的起点","科学效度有争议，不宜据此给自己贴标签"]]},{"type":"h","text":"找到你的品牌个性"},{"type":"p","text":"品牌原型来自 Margaret Mark 与 Carol Pearson 的《英雄与反叛者》（2001），它把荣格的原型理论用于品牌人格。选一个主原型、一个辅原型，你的语调和内容风格就有了方向。"},{"type":"tool","id":"archetype"},{"type":"checklist","id":"discover-out","title":"本节产出","items":["写下 10 条经验资产（尽量包含可量化的结果）","收到至少 5 份他人反馈","确定 3–5 个核心价值观","选出 3 个品牌关键词","选定主原型与辅原型"]}]},{"id":"position","title":"定位","en":"Position","lead":"定位就是在目标人群心中占据一个清晰、独特、有价值的位置。宁做小池塘里的大鱼。","reviewed":"2026-10-10","blocks":[{"type":"p","text":"Al Ries 与 Jack Trout 在《定位》（1981）中指出：竞争发生在**心智**里，而不是货架上。人们对一个领域只会记住少数几个名字。你的任务不是“什么都会”，而是成为某一类问题的**第一联想**。"},{"type":"formula","text":"定位 = 目标人群 × 核心价值 × 独特方式","note":"三者缺一不可：没有人群就没有需求，没有价值就没有理由，没有独特方式就没有记忆点。"},{"type":"cards","cols":3,"items":[{"title":"目标人群（Who）","text":"越具体越好。“想转行做数据分析的 25–35 岁职场人”胜过“所有想学习的人”。能画出用户画像，才写得出打动他的内容。"},{"title":"核心价值（What）","text":"你帮他们解决什么问题、获得什么结果？用对方的语言描述“前后变化”，而不是罗列你的技能。"},{"title":"独特方式（Why me）","text":"可能来自独特经历、方法论、技能组合、视角或风格。差异不必巨大，但必须真实、可感知。"}]},{"type":"h","text":"三种常用的差异化策略"},{"type":"cards","cols":3,"items":[{"title":"技能叠加","tag":"Talent Stack","text":"两三项排在前 25% 的技能组合起来就会形成稀缺：懂设计的程序员、会写作的律师、懂数据的 HR。"},{"title":"人群细分","tag":"Niche","text":"同一项技能，服务更细分的人群。不做“健身教练”，做“久坐程序员的肩颈康复教练”。"},{"title":"视角与方法","tag":"Point of view","text":"用独特的框架或立场解释领域问题：有依据的反常识观点、有名字的方法论、基于亲身实验的结论。"}]},{"type":"h","text":"定位陈述模板"},{"type":"templates","items":[{"title":"经典式","text":"我帮助【目标人群】通过【独特方法】实现【期望结果】。"},{"title":"对比式","text":"不同于【常见做法】，我【你的差异点】，让【目标人群】【获得的结果】。"},{"title":"身份式","text":"【身份/头衔】｜专注【领域】｜【最有力的信任状】"},{"title":"Geoffrey Moore 式（出自《跨越鸿沟》）","text":"对于【目标人群】，他们需要【需求】。我是【类别】，能够【核心收益】。不同于【替代方案】，我【关键差异】。"}]},{"type":"tool","id":"canvas"},{"type":"h","text":"在几个方向之间犹豫？"},{"type":"p","text":"把候选领域放进评估矩阵，按热爱、擅长、需求、变现、竞争和持久性打分，让直觉和数据互相校验。"},{"type":"tool","id":"niche"},{"type":"checklist","id":"position-test","title":"定位检验清单","items":["能在 30 秒内向陌生人说清楚（电梯测试）","目标人群具体到能描述他的一天","这个问题真实存在：有人在搜索、讨论、付费","你有至少一项可信的证据（作品、经历或结果）","足够窄能被记住，足够宽能做 3–5 年","与你的价值观一致，你愿意长期谈论它","别人很难在一个月内复制你的组合"]},{"type":"callout","tone":"tip","title":"还不是专家？做“公开学习者”","text":"可以把定位设为“在 X 领域公开学习、分享实践记录的人”。swyx（Shawn Wang）在《Learn in Public》（2018）中提倡的就是这种方式：记录本身就有价值，而且会随着你的成长自然升级为专家定位。"},{"type":"callout","tone":"note","title":"窄进宽出","text":"先窄后宽更稳妥：从“Python 数据分析入门”起步，积累信任后扩展为“数据科学”，再到“AI 时代的数据决策”。过早求宽，等于没有定位。"}]},{"id":"identity","title":"识别","en":"Identity","lead":"让人 3 秒认出你、30 秒记住你。名字、头像、简介、语调和故事，是品牌的“包装”。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"名字与账号"},{"type":"table","head":["","实名","笔名 / 昵称"],"rows":[["信任建立","快：与职业身份、线下关系直接关联","慢：需要更多作品来证明"],["隐私保护","较弱：需要更注意信息边界","较强：便于隔离工作与生活"],["可迁移性","强：跨平台、跨职业都能沿用","视名称而定：可能与特定领域绑定"],["适合","职场人、顾问、专业服务、创业者","创作者、注重隐私的人、尝试新领域的人"]]},{"type":"list","items":["在所有平台尽量使用**同一个名字或 ID**，方便被搜索，也方便 AI 把这些账号识别为同一个人。","注册与名字一致的域名（如 yourname.com），作为长期的“门牌号”。","名字要好读、好拼、好搜：避开生僻字和容易混淆的字母数字组合。"]},{"type":"h","text":"头像与视觉"},{"type":"list","items":["头像：清晰的正面照、自然的表情、简洁的背景。所有平台统一用同一张，至少保持一年。","视觉：选定 1–2 个主色和 1–2 种字体，做成封面、配图和幻灯片模板。你不需要 logo，需要的是一致。","横幅或封面：写清“你帮谁做什么”，再加一个信任状，而不是放一张风景照。"]},{"type":"h","text":"简介（Bio）公式"},{"type":"templates","items":[{"title":"一句话版（40 字以内，用于各平台简介）","text":"【身份】｜帮【人群】【结果】｜【信任状】"},{"title":"短版（100 字以内，用于自我介绍、嘉宾介绍）","text":"我是【名字】，【身份】。我专注于帮助【人群】【解决问题/实现结果】。过去【年数】年，我【最有力的成就或数据】。【行动号召，如欢迎交流/订阅/合作】。"},{"title":"长版（300–500 字，第三人称，用于官网与演讲介绍）","text":"【名字】是【身份】，【一句话使命】。【经历概述：关键转折与成就】。【方法论或代表作】。【媒体、合作、认证等背书】。【目前在做的事与联系方式】。"}]},{"type":"callout","tone":"tip","title":"自动生成简介","text":"在 [[tools.canvas|定位画布]] 中填好信息，会同时生成定位陈述、三种长度的简介和 30 秒电梯演讲。"},{"type":"h","text":"语调（Voice & Tone）"},{"type":"p","text":"用 3 个形容词定义你的品牌个性，再用“是……而不是……”划清边界，防止用力过猛："},{"type":"table","head":["我们是","而不是"],"rows":[["专业","晦涩难懂"],["直接","刻薄冒犯"],["幽默","轻浮油腻"],["自信","傲慢自夸"],["真诚","过度暴露"]]},{"type":"h","text":"品牌故事的六个段落"},{"type":"steps","items":[{"title":"过去的困境","text":"你曾遇到和目标人群相同的问题。"},{"title":"转折点","text":"一个触发你改变的事件或顿悟。"},{"title":"探索与挣扎","text":"尝试、失败、再尝试。正是这一段让故事可信。"},{"title":"发现与方法","text":"你找到的答案，以及由此形成的方法论。"},{"title":"现在的使命","text":"你为什么想帮助更多人。"},{"title":"邀请","text":"对方可以怎样与你同行。"}]},{"type":"callout","tone":"insight","title":"在故事里，受众才是英雄","text":"Donald Miller 的 StoryBrand 框架（《Building a StoryBrand》，2017）提醒我们：品牌故事的主角是受众，你是帮助他的“向导”，就像尤达之于卢克。多讲“他会变成什么样”，少讲“我有多厉害”。"},{"type":"h","text":"信任状清单"},{"type":"cards","cols":3,"items":[{"title":"作品与案例","text":"可以展示的成果、前后对比和数据。"},{"title":"客户与同行评价","text":"具名推荐、反馈截图（需获得授权）。"},{"title":"资历与认证","text":"学历、证书、行业资质与任职经历。"},{"title":"第三方背书","text":"媒体报道、演讲邀请、合作机构。"},{"title":"社会认同","text":"关注者、订阅者、阅读量。只作补充，不能当核心。"},{"title":"公开记录","text":"开源贡献、出版物、长期连续输出的内容存档。"}]},{"type":"checklist","id":"identity-check","title":"识别一致性检查","items":["所有平台使用同一个名字或 ID","所有平台使用同一张头像","一句话简介在各平台表述一致","每个主页都有清晰的下一步（订阅、联系或作品）","注册了个人域名","准备好短版与长版简介","写好了 300 字左右的品牌故事"]}]},{"id":"platform","title":"阵地","en":"Platforms","lead":"先选对主阵地，再搭自有阵地。在别人的土地上开花，在自己的土地上结果。","reviewed":"2026-10-10","volatile":true,"blocks":[{"type":"diagram","kind":"hubspoke","title":"中心辐射模型","caption":"在租用阵地和赢得阵地上获得关注，再把关系沉淀到中心的自有阵地。平台的规则、算法乃至账号状态都可能变化，只有自有阵地真正属于你。","data":{"hub":{"label":"自有阵地","text":"个人网站 · 邮件订阅 · 私域社群"},"spokes":[{"label":"租用阵地","text":"公众号、小红书、抖音、B站、知乎、LinkedIn、X、YouTube 等平台账号","flow":"导流"},{"label":"赢得阵地","text":"媒体报道、播客嘉宾、他人推荐、行业榜单","flow":"背书"},{"label":"线下阵地","text":"行业活动、演讲、沙龙、社群聚会","flow":"连接"},{"label":"付费阵地","text":"广告投放、付费推广（品牌成熟后再考虑）","flow":"放大"}]}},{"type":"table","head":["类型","例子","优势","风险"],"rows":[["自有（Owned）","个人网站、Newsletter、私域社群、播客 RSS","完全掌控、可直接触达、可迁移","冷启动慢，需要从其他渠道导流"],["租用（Rented）","各社交与内容平台账号","流量大、发现机制强","规则与算法变化、限流、封号风险"],["赢得（Earned）","媒体报道、播客嘉宾、他人推荐","信任度最高","不可控，需要长期积累"]]},{"type":"h","text":"选平台前先问四个问题"},{"type":"steps","items":[{"title":"你的目标人群在哪里？","text":"这是最重要的问题，比“哪个平台流量大”重要得多。"},{"title":"你最擅长哪种表达？","text":"写作、镜头、声音、代码，还是图像。"},{"title":"内容寿命有多长？","text":"搜索型平台（知乎、YouTube、小红书搜索、博客）的内容能持续带来流量；信息流平台的内容寿命以天计。"},{"title":"投入产出比如何？","text":"短视频起量快但制作成本高；长文积累慢但信任更深。"}]},{"type":"callout","tone":"tip","title":"1 + 1 + 1 起步组合","text":"**1 个主阵地**深耕（约 70% 精力）＋ **1 个分发阵地**复用改编内容（约 20%）＋ **1 个自有阵地**沉淀关系（约 10%，如 Newsletter 或个人网站）。"},{"type":"tool","id":"platform"},{"type":"h","text":"个人网站的必备要素"},{"type":"list","style":"check","items":["首页第一屏：一句话定位、照片和一个主要的行动按钮","关于页：你的故事、价值观与照片","作品或案例页：3–5 个最能代表你的成果","内容页：文章、视频、播客的归档","订阅入口：邮件订阅或私域入口","合作页：合作方式和媒体资料包（简介、高清照片、可讲话题）","结构化数据：用 schema.org 的 Person 标记姓名、职位和 sameAs（各平台主页链接），帮助搜索引擎与 AI 准确识别你"]},{"type":"checklist","id":"profile-setup","title":"账号装修清单","items":["头像清晰，且全平台统一","横幅写清价值主张","简介包含：身份、帮谁、信任状、行动号召","置顶一条最能代表你的内容","主页链接指向自有阵地","联系方式或合作方式清晰可见","用精选或合集整理好代表作"]}]},{"id":"content","title":"内容","en":"Content","lead":"内容是品牌的“试用装”：让陌生人零成本地体验你的价值。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"内容支柱（Content Pillars）"},{"type":"p","text":"选 3–5 个长期稳定的主题作为支柱，所有内容都从这里长出来。下表是常见的起步配比，可以按你的定位调整："},{"type":"table","head":["支柱","参考占比","作用","示例（数据分析师）"],"rows":[["核心专业","50–60%","建立专业信任","SQL 技巧、分析框架、案例拆解"],["行业洞察","15–25%","展示判断力与视野","趋势评论、工具对比、数据解读"],["个人故事","10–15%","建立情感连接","转行经历、踩坑复盘、成长记录"],["生活与兴趣","5–10%","增加人味和记忆点","读书、跑步、旅行中的观察"]]},{"type":"h","text":"内容的四种目的"},{"type":"cards","cols":4,"items":[{"title":"教育","tag":"Educate","text":"教程、清单、框架。带来收藏与信任。"},{"title":"启发","tag":"Inspire","text":"故事、观点、案例。带来共鸣与分享。"},{"title":"娱乐","tag":"Entertain","text":"幽默、反差、轻松内容。带来传播与亲近感。"},{"title":"转化","tag":"Convert","text":"案例、评价、产品介绍。带来行动，占比不宜超过 10–20%。"}]},{"type":"h","text":"内容形式对比"},{"type":"table","head":["形式","制作成本","传播力","信任深度","内容寿命"],"rows":[["短帖 / 图文卡片","低","中","低–中","短"],["长文 / Newsletter","中","中","高","长（可被搜索）"],["短视频","中–高","高","中","短–中"],["长视频","高","中","高","长（可被搜索）"],["播客 / 音频","中","低–中","很高","长"],["直播","中","中","高","短（可切片复用）"],["开源项目 / 工具 / 模板","高","中","很高","很长"]]},{"type":"h","text":"一鱼多吃：内容原子化"},{"type":"diagram","kind":"pyramid","title":"内容金字塔","caption":"先做一个支柱内容，再拆成多种形式、分发到多个平台。这样既保证深度，又维持更新频率。这一方法常被称为“支柱内容模型”或“内容金字塔”。","data":{"levels":[{"label":"支柱内容","count":"1","text":"1 篇深度长文、1 期长视频或 1 场演讲"},{"label":"衍生内容","count":"3–5","text":"短文、短视频、Newsletter、图文合集"},{"label":"微内容","count":"10–20","text":"帖子、金句卡片、片段、问答"}]}},{"type":"h","text":"选题从哪里来"},{"type":"list","items":["**受众问题库**：收集评论、私信和问答平台上的真实问题，一个问题就是一个选题。","**经验萃取**：把做过的项目变成方法论、清单、模板或复盘。","**观点表达**：对行业热点给出有依据的独立判断，避免为蹭而蹭。","**系列栏目**：固定栏目（如“每周工具”“案例拆解第 N 期”）降低选题成本，也培养期待感。","**拆解高表现内容**：分析同领域优秀内容的选题、标题和结构，学习方法而不是照抄。","**公开实验**：亲自尝试并记录结果。“我用 30 天做了 X”自带故事和数据。"]},{"type":"h","text":"四个结构公式"},{"type":"cards","cols":2,"items":[{"title":"钩子 → 价值 → 行动","text":"开头 3 秒或 3 行给出继续看的理由，中间交付价值，结尾给出下一步。"},{"title":"PAS","text":"问题（Problem）→ 放大痛点（Agitate）→ 解决方案（Solution）。经典文案结构。"},{"title":"AIDA","text":"注意（Attention）→ 兴趣（Interest）→ 欲望（Desire）→ 行动（Action）。"},{"title":"故事四段","text":"情境 → 冲突 → 转折或解决 → 启示。"}]},{"type":"h","text":"内容生产流水线"},{"type":"steps","items":[{"title":"捕获","text":"随时把灵感记进素材库（备忘录、Notion、Obsidian、飞书等都可以）。"},{"title":"筛选","text":"每周从选题池里按影响、把握、难易打分排序。"},{"title":"批量创作","text":"固定时间块集中写作或拍摄，一次产出多条。"},{"title":"编辑","text":"打磨结构、标题和开头；可以用 AI 辅助润色与校对。"},{"title":"发布与分发","text":"按日历排程，再改编分发到其他平台。"},{"title":"复盘","text":"看数据，找出表现前 10% 的内容，分析原因。"},{"title":"归档","text":"按支柱整理进内容资产库，方便日后复用。"}]},{"type":"h","text":"AI 时代的创作分工"},{"type":"compare","mode":"neutral","left":{"title":"可以交给 AI","items":["头脑风暴与选题扩展","大纲与结构建议","改写成不同平台的版本","校对、字幕、翻译","数据整理与图表初稿"]},"right":{"title":"必须留给自己","items":["观点与判断","真实的经历与案例","独特的语气与风格","事实核查与最终把关","与受众的真实互动"]}},{"type":"callout","tone":"warn","title":"按规定标注 AI 生成内容","text":"中国《人工智能生成合成内容标识办法》自 2025 年 9 月 1 日起施行，要求对 AI 生成合成内容添加显式或隐式标识；欧盟《人工智能法》第 50 条的透明度义务自 2026 年 8 月 2 日起适用。主流平台也有各自的标注规则。发布 AI 生成的图像、音视频或拟真人物时，请按规则标注。"},{"type":"callout","tone":"tip","title":"给 AI 一份“品牌风格说明”","text":"把你的定位、受众、语调规则、禁用词和 3 篇代表作放进提示词，AI 的输出会更像你。本指南的 [[tools.advisor|品牌顾问]] 会自动带上你的定位画布。"},{"type":"tool","id":"calendar"},{"type":"checklist","id":"content-qa","title":"发布前质量检查","items":["对目标受众有用：读完能学到、感受到或做到什么","有独特视角或亲身经验","标题和开头有明确的钩子","结构清晰、方便扫读","结尾有一个明确的下一步","与品牌定位和语调一致","事实、数据和引用都核查过","涉及 AI 生成的内容已按规则标注"]}]},{"id":"launch","title":"启动","en":"Launch","lead":"冷启动没有捷径，但有顺序：先盘活已有关系，再用参与和合作撬动新的关注。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"冷启动五步"},{"type":"steps","items":[{"title":"一周内上线最小可行品牌","text":"统一头像与简介、选定主阵地、发布 3 篇内容、留一个联系或订阅入口。先完成，再完美。"},{"title":"告诉已经认识你的人","text":"在朋友圈、同事群和前同事网络里发一条“宣言”：你在做什么、能帮到谁。第一批关注者往往来自熟人网络。"},{"title":"参与式增长","text":"每天花 15–30 分钟，在目标人群聚集的地方留下高质量的评论和回答。先给予，再索取。"},{"title":"打造一个旗舰作品","text":"一篇深度长文、一个开源项目、一份行业报告或一个免费工具，作为会被反复转发的“名片”。"},{"title":"借势与合作","text":"与同阶段的创作者互推、做联合内容、互为嘉宾；主动申请播客嘉宾和线下分享。"}]},{"type":"tool","id":"roadmap"},{"type":"h","text":"值得庆祝的里程碑"},{"type":"list","style":"check","items":["前 100 位真实关注者（不算熟人互关）","第一次有陌生人引用或转发你的内容","第一次有人因为你的内容主动联系你","第一次通过品牌获得机会或收入","第一次有人把你推荐给别人"]},{"type":"callout","tone":"warn","title":"不要买粉、刷量","text":"虚假数据会扭曲你的判断、损害账号权重，还可能违规违法。美国 FTC 2024 年发布的消费者评价规则明确禁止为商业目的买卖虚假的社交影响力指标（如机器人粉丝和刷量）；国内主流平台也在持续打击刷量行为。"}]}]},"maintain":{"id":"maintain","title":"维护","en":"Maintain","stage":"maintain","kicker":"第二阶段 · 从 1 到 N","summary":"用系统保持一致，经营关系，度量效果，守护声誉，适时进化，并让这一切可以长期持续。","sequential":false,"reviewed":"2026-10-10","sections":[{"id":"consistency","title":"一致性系统","en":"Consistency","lead":"信任 = 一致 × 时间。维护品牌靠的不是意志力，而是一套可以持续运转的系统。","reviewed":"2026-10-10","blocks":[{"type":"p","text":"品牌的复利来自稳定：稳定的主题让人记住你，稳定的节奏让人期待你，稳定的质量让人信任你。三者之中，**可持续**比“高频”重要得多。宁可每周一篇坚持一年，也不要每天一篇坚持一个月。"},{"type":"h","text":"维护节奏表"},{"type":"table","head":["频率","时间投入","关键动作"],"rows":[["每天","15–30 分钟","回复评论与私信、在目标社区互动、记录灵感"],["每周","2–5 小时","创作与发布、看一眼核心数据、主动联系 1–2 个人"],["每月","半天","数据复盘、规划下月选题、更新作品集与案例"],["每季度","1 天","品牌体检、调整目标、清理过时信息、更新简介与照片"],["每年","2–3 天","年度品牌审计、定位迭代、年度总结、规划下一年"]]},{"type":"h","text":"让坚持变容易的五个方法"},{"type":"cards","cols":2,"items":[{"title":"批处理","text":"固定每周的“内容日”，一次写 3 篇或一次拍 5 条。频繁切换是持续输出最大的敌人。"},{"title":"模板化","text":"内容模板、封面模板、发布清单、常见问题回复模板，把重复劳动变成填空。"},{"title":"内容缓冲","text":"保持 2–4 周的存稿。生病、出差或忙季时，品牌也不会断档。"},{"title":"素材库","text":"按 Tiago Forte 的 CODE 方法管理灵感：捕获（Capture）、整理（Organize）、提炼（Distill）、表达（Express）。"},{"title":"旧内容再利用","text":"更新常青内容、做年度合集、跨平台改编。好内容值得被讲三遍。"}]},{"type":"h","text":"写一份品牌手册（Brand Book）"},{"type":"p","text":"把定位、关键词、语调、视觉规范、各版本简介、常用话术和不碰的话题整理成一份文档。它能让你自己、助理、合作方乃至 AI 工具的输出保持一致。在 [[plan|我的方案]] 页面可以一键生成初稿。"},{"type":"checklist","id":"system-setup","title":"一致性系统搭建","items":["确定可持续的发布节奏，并写进日历","设定每周固定的创作时间块","建立素材库与选题池","做好 3 个以上常用内容模板","储备 2 周以上的存稿","写好品牌手册初稿"]}]},{"id":"community","title":"社群与关系","en":"Community","lead":"受众是一对多的广播，社群是多对多的网络。品牌真正的护城河，是人与人之间的关系。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"互动的基本功"},{"type":"list","items":["**发布后的第一个小时**及时回复评论：这是对读者的尊重，也会影响平台的分发。","认真回复有价值的评论，用追问延续对话；把好问题变成下一期内容。","私信是深度关系的入口：真诚、具体、不推销。","记住经常互动的人，适时点名感谢、引用他们的观点。"]},{"type":"h","text":"关系网络的三个方向"},{"type":"cards","cols":3,"items":[{"title":"向上","text":"前辈和行业意见领袖。提供价值而不是索取：引用他们的观点并附上你的实践，帮他们解决一个小问题。"},{"title":"平行","text":"同阶段的同行与创作者。互相支持、互推、合作，你们是彼此最好的放大器。"},{"title":"受众","text":"读者、学员、客户。倾听需求、提供帮助，让他们成为共创者。"}]},{"type":"callout","tone":"insight","title":"弱连接的力量","text":"社会学家 Mark Granovetter 在《弱连接的力量》（1973）中发现：新的机会，尤其是工作机会，常常来自不太联系的熟人，也就是“弱连接”。个人品牌会让你的弱连接网络规模更大、质量更高。"},{"type":"h","text":"个人关系管理"},{"type":"list","items":["记录重要联系人：在哪里认识、对方的需求与兴趣、上次联系的时间。","定期“无事问候”：分享一篇对方可能感兴趣的文章，祝贺对方的新进展。","主动连接资源：把两个能互相帮助的人介绍给彼此。","工具不重要，坚持才重要：表格、Notion、通讯录备注都可以。"]},{"type":"h","text":"从受众到社群"},{"type":"steps","items":[{"title":"建立讨论空间","text":"微信群、知识星球、Discord、Circle 等，选目标人群最习惯的工具。"},{"title":"设计共同仪式","text":"每周话题、打卡挑战、月度分享会，让成员有固定的理由回来。"},{"title":"让成员互相连接","text":"介绍新人、鼓励成员分享，从“你和每个人”变成“大家和大家”。"},{"title":"培养核心成员","text":"邀请活跃者担任志愿者、一起共创内容。"},{"title":"定好规则并执行","text":"社群的文化，由你能容忍的最差行为决定。"}]},{"type":"checklist","id":"community-habits","title":"关系维护习惯","items":["发布后 1 小时内回复评论","每周主动联系 1–2 位同行或前辈","建立个人关系记录（表格或工具）","每月至少一次“无事问候”","每季度至少一次合作（互推、联合内容或互为嘉宾）"]}]},{"id":"measure","title":"度量与复盘","en":"Measure","lead":"没有度量就没有改进。但要量对东西：从“多少人看到”走向“多少机会找上门”。","reviewed":"2026-10-10","blocks":[{"type":"diagram","kind":"funnel","title":"品牌指标的五个层级","caption":"越往下越接近品牌的真实价值，也越难被“刷”出来。最显眼的曝光数字，恰恰最容易误导判断。","data":{"stages":[{"label":"曝光","text":"展示量 · 播放量 · 搜索可见度"},{"label":"互动","text":"互动率 · 收藏率 · 分享率 · 评论质量"},{"label":"关系","text":"关注净增 · 订阅数 · 打开率"},{"label":"信任","text":"主动提及 · 合作邀约 · 咨询"},{"label":"价值","text":"机会数 · 转化率 · 收入"}]}},{"type":"h","text":"不同阶段的北极星指标"},{"type":"table","head":["阶段","北极星指标","辅助指标"],"rows":[["起步（0–6 个月）","稳定发布的周数","互动率、收藏率、前 100 位真实关注者"],["成长（6–18 个月）","自有阵地订阅者数","关注净增、打开率、被转发与被引用次数"],["成熟（18 个月以后）","主动找上门的机会数","转化率、收入、客单价、复购与推荐"]]},{"type":"h","text":"关键公式"},{"type":"list","items":["**互动率** = （点赞 + 评论 + 分享 + 收藏）÷ 曝光量。也有平台按粉丝数计算，横向比较时要保持口径一致。","**收藏率** = 收藏 ÷ 曝光量，是“有用”的信号。","**分享率** = 分享 ÷ 曝光量，是“值得转述”的信号。","**关注转化率** = 新增关注 ÷ 主页访问量，反映简介和主页是否有说服力。","**订阅转化率** = 新增订阅 ÷ 落地页访问量，反映引流品是否有吸引力。"]},{"type":"h","text":"三种复盘方法"},{"type":"cards","cols":3,"items":[{"title":"内容复盘","text":"每月找出表现前 10% 和后 10% 的内容，对比选题、标题、形式和发布时间。前者加倍，后者调整或放弃。"},{"title":"复盘四步","text":"回顾目标 → 评估结果 → 分析原因 → 总结规律。国内企业常用的方法，简单有效。"},{"title":"AAR 与 KPT","text":"AAR（行动后回顾）问四个问题：预期是什么、实际发生了什么、差异的原因、下次怎么做。KPT 则分 Keep / Problem / Try 三栏。"}]},{"type":"tool","id":"metrics"},{"type":"callout","tone":"warn","title":"别被数据绑架","text":"每天刷数据只会制造焦虑。看趋势而不是单点，看周和月而不是小时。数据是辅助判断的，不是替代判断的。"}]},{"id":"reputation","title":"声誉管理","en":"Reputation","lead":"声誉是品牌最脆弱的资产：建立需要数年，损毁只需要一条内容。","reviewed":"2026-10-10","volatile":true,"blocks":[{"type":"h","text":"数字足迹自查"},{"type":"steps","items":[{"title":"搜索引擎","text":"搜索你的名字，再分别加上城市、职业或公司名。"},{"title":"社交平台","text":"在各平台站内搜索你的名字和常用 ID。"},{"title":"AI 助手","text":"问几个主流 AI 助手：“（你的名字 + 领域）是谁？”看它们怎样描述你。"},{"title":"清理与更新","text":"处理过时、不一致或不当的信息：旧头像、旧职位、早年的不当言论。"},{"title":"设置提醒","text":"为你的名字设置搜索提醒（如 Google Alerts），并定期复查。"}]},{"type":"h","text":"让 AI 准确地认识你"},{"type":"p","text":"越来越多的人通过 AI 助手和 AI 搜索摘要来了解一个人。AI 会综合网上的公开信息来描述你：信息越一致、来源越权威，描述就越准确。"},{"type":"list","style":"check","items":["在个人网站的“关于”页用清晰的陈述句写明：你是谁、做什么、代表作是什么","使用 schema.org Person 结构化数据，并用 sameAs 链接你的各平台主页","在 LinkedIn、知乎、GitHub、行业协会网站等高权重平台保持资料完整、一致","争取被可信来源提及：媒体报道、播客、会议演讲、行业报告","发布原创数据和研究，它们最容易被引用","每季度用几个 AI 助手复查一次；发现错误时，从你能控制的源头页面修正"]},{"type":"h","text":"危机应对五步"},{"type":"p","text":"任何活跃的公开表达者都可能遇到负面事件。提前准备预案，事发时才不会慌乱。"},{"type":"steps","items":[{"title":"暂停","text":"不要情绪化回应；暂停已经排期的内容，避免不合时宜。"},{"title":"评估","text":"事实是什么？是否属实？传播范围多大？是否涉及法律或安全问题？"},{"title":"回应","text":"属实就真诚道歉（承认、承担、改正、跟进）；误解就平和澄清并给出证据；恶意造谣就保留证据、平台举报，必要时走法律途径。"},{"title":"修复","text":"用行动证明改变，持续输出价值，让时间修复信任。"},{"title":"复盘","text":"找到根本原因，建立预防机制。"}]},{"type":"tool","id":"crisis"},{"type":"compare","left":{"title":"糟糕的道歉","items":["“如果冒犯到了某些人……”","只为“造成的误会”道歉","道歉之后附带辩解和反击","删帖了事，长期沉默"]},"right":{"title":"好的道歉","items":["及时：尽早发出初步回应（通常建议 24 小时内）","具体：说清楚错在哪里","承担：不推卸、不找借口","行动：说明改正措施，并按时跟进"]}},{"type":"h","text":"面对负面评论与网络暴力"},{"type":"cards","cols":3,"items":[{"title":"建设性批评","text":"感谢并认真对待，能改进的就公开改进。这会为你赢得尊重。"},{"title":"误解","text":"平和地澄清一次，提供信息即可，不必反复争辩。"},{"title":"恶意攻击","text":"不回应、屏蔽、举报，并保存证据。《网络暴力信息治理规定》自 2024 年 8 月 1 日起施行，要求平台提供一键防护、举报等功能。"}]},{"type":"checklist","id":"reputation-routine","title":"声誉维护例行事项","items":["每季度搜索一次自己的名字（搜索引擎 + AI 助手）","为自己的名字设置搜索提醒","发布前问三个问题：真实吗？必要吗？友善吗？","写好危机应对预案和联系人清单","对早期内容做一次审查"]}]},{"id":"evolve","title":"进化与转型","en":"Evolve","lead":"你在成长，市场在变化，平台在更替。品牌不是一次定型，而是持续迭代的产品。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"年度品牌审计"},{"type":"list","style":"number","items":["重新做一次 [[tools.audit|品牌体检]]，和上一次的雷达图对比。","问 10 个人：“你会怎样向别人介绍我？”对照你的定位陈述。","盘点各渠道的投入产出：哪些平台、哪类内容带来了真正的机会。","检查受众变化：现在关注你的人，还是你想服务的人吗？","更新定位、简介、照片、作品集与品牌手册。"]},{"type":"h","text":"需要调整定位的信号"},{"type":"list","items":["你对当前主题失去热情，创作越来越像任务。","吸引来的人，不是你想服务的人。","市场需求明显萎缩，或被 AI 等新技术大幅替代。","你的职业方向发生了变化。","出现了更大、更匹配你优势的机会。"]},{"type":"h","text":"平滑转型的方法"},{"type":"steps","items":[{"title":"找到桥梁","text":"寻找新旧领域的交叉点作为过渡内容，比如“设计师 → 设计师的 AI 工作流”。"},{"title":"渐进调整比例","text":"新主题从 20% 开始，逐步提高到 50%、80%。"},{"title":"公开讲述转型","text":"坦诚地说明原因和思考。转型本身就是好内容。"},{"title":"保留身份的连续性","text":"价值观、语调和视觉保持不变，让老受众依然认得你。"},{"title":"不要轻易删除过去","text":"除非内容有害。过去的积累，是你可信度的一部分。"}]},{"type":"callout","tone":"insight","title":"从个人到组织","text":"品牌做大之后，可以逐步引入助理、团队和流程，把部分方法论产品化，甚至孵化一个独立于你本人的产品品牌，以降低“关键人风险”。"}]},{"id":"sustain","title":"可持续","en":"Sustain","lead":"能长期做下去的品牌才有复利。保护好你的精力、隐私、账号和法律边界。","reviewed":"2026-10-10","volatile":true,"blocks":[{"type":"h","text":"防止倦怠"},{"type":"compare","mode":"neutral","left":{"title":"倦怠信号","items":["创作从期待变成负担","频繁刷数据，并因此焦虑","对负面评论过度敏感","品牌工作挤占本职、健康与家庭时间"]},"right":{"title":"应对方法","items":["降到“最小可持续节奏”","储备存稿，安排创作假期并提前告知受众","关注过程指标（写了几篇），而不是结果指标（涨了多少粉）","区分“作为人的你”和“作为品牌的你”"]}},{"type":"h","text":"隐私边界"},{"type":"list","items":["事先划定“公开 / 不公开”清单：工作和观点可以公开；家人（尤其是孩子）的正脸、住址、实时位置和财务细节默认不公开。","发照片前检查背景：门牌、车牌、工牌、快递单、窗外的标志性建筑。","关闭照片的位置信息；分享行程尽量延后发布。","把公开联系方式和私人联系方式分开：使用工作邮箱和工作号码。"]},{"type":"h","text":"账号安全"},{"type":"list","items":["每个平台使用不同的强密码，并使用密码管理器。","开启两步验证，优先使用验证器 App 或安全密钥，而不是短信。","绑定可靠的备用手机和邮箱，记下账号找回方式。","警惕钓鱼：“品牌合作邀约”“账号违规申诉”是针对创作者的常见骗局。不点陌生链接，不下载陌生附件。","有助理或团队时，使用平台的子账号和权限功能，不共享主密码。","定期导出备份你的内容。"]},{"type":"h","text":"法律与合规要点"},{"type":"p","text":"以下为一般性提示，不构成法律意见。规则可能变化，具体问题请咨询专业人士。"},{"type":"table","head":["事项","要点"],"rows":[["雇主政策","了解公司的社交媒体政策、保密协议与竞业限制；不泄露商业机密；必要时注明“仅代表个人观点”。"],["广告标识","商业合作内容需显著标明“广告”。中国《互联网广告管理办法》自 2023 年 5 月 1 日起施行；美国 FTC《背书指南》要求清晰披露合作关系。"],["AI 内容标识","中国《人工智能生成合成内容标识办法》自 2025 年 9 月 1 日起施行；欧盟《人工智能法》第 50 条透明度义务自 2026 年 8 月 2 日起适用。"],["版权","图片、音乐、字体和视频素材都需要授权（商用字体侵权纠纷尤其常见）；引用注明出处；用水印和原创声明保护自己的作品。"],["专业资质","在金融、医疗、法律、教育等领域提供专业信息时，平台通常要求相应的资质认证。"],["个人信息","未经同意，不公开他人的个人信息和聊天记录（参见《个人信息保护法》）。"],["合同","商业合作签书面合同：交付物、修改次数、使用范围与期限、付款节点、排他条款、违约责任。"],["税务","品牌收入依法申报纳税；收入规模较大时，可以考虑以个体工商户或公司形式经营，并咨询税务专业人士。"]]},{"type":"checklist","id":"safety-check","title":"安全与合规自查","items":["所有重要账号已开启两步验证","使用密码管理器，没有重复使用的密码","已绑定备用手机与邮箱","公开与私人联系方式已经分开","已了解雇主的社交媒体政策","商业合作内容都按规定做了标识","使用的图片、字体、音乐都有授权","已备份主要平台的内容"]}]}]},"leverage":{"id":"leverage","title":"利用","en":"Leverage","stage":"leverage","kicker":"第三阶段 · 从 N 到价值","summary":"把注意力和信任转化为职业机会、商业收入与行业影响力，再把成果沉淀为不依赖你个人时间的资产。","sequential":false,"reviewed":"2026-10-10","sections":[{"id":"mindset","title":"杠杆思维","en":"Mindset","lead":"个人品牌是一种无需许可的杠杆：它让你的能力被更多人看见，让信任在见面之前就建立起来。","reviewed":"2026-10-10","blocks":[{"type":"p","text":"Naval Ravikant 在《How to Get Rich》（2018）中把杠杆分为四类：**劳动力**、**资本**、**代码**和**媒体**。前两类需要别人许可（有人愿意为你工作、给你钱），后两类不需要：写一篇文章、录一期视频，它就能在你睡觉时继续为你工作。个人品牌正是媒体杠杆与信任的结合，而且能放大其他所有杠杆。"},{"type":"cards","cols":4,"items":[{"title":"劳动力","tag":"需要许可","text":"他人为你工作。需要管理能力和信任。"},{"title":"资本","tag":"需要许可","text":"用钱生钱。需要原始积累。"},{"title":"代码","tag":"无需许可","text":"软件与工具，可以无限复制。"},{"title":"媒体","tag":"无需许可","text":"内容与影响力，可以无限分发。这是个人品牌的主战场。"}]},{"type":"h","text":"信任沙漏"},{"type":"diagram","kind":"hourglass","title":"营销沙漏","caption":"这一模型来自 John Jantsch 的《Duct Tape Marketing》（2007）。品牌让前三步（知道、喜欢、信任）在你不在场时自动发生；交付质量则决定后两步（复购、推荐）能否让沙漏重新变宽。","data":{"pivot":4,"stages":[{"label":"知道","text":"看到你的内容"},{"label":"喜欢","text":"认同你的观点与风格"},{"label":"信任","text":"相信你能解决问题"},{"label":"尝试","text":"免费资源、低价产品"},{"label":"购买","text":"核心产品或服务"},{"label":"复购","text":"持续合作、升级"},{"label":"推荐","text":"主动介绍新的人"}]}},{"type":"callout","tone":"insight","title":"信任是本金，收入是利息","text":"任何透支信任的变现（推荐劣质产品、夸大承诺、隐瞒合作）都在消耗本金。短期收益越诱人，越要守住底线。"}]},{"id":"career","title":"职业发展","en":"Career","lead":"品牌让机会主动找上门：从“我去找工作”变成“工作来找我”。","reviewed":"2026-10-10","blocks":[{"type":"cards","cols":2,"items":[{"title":"被动求职","text":"招聘方和猎头会主动联系在领域内有可见度的人。你的内容就是一份持续更新的作品集。"},{"title":"跳过筛选","text":"面试官在见面前往往会搜索你。高质量的公开作品，能让信任在见面之前就建立起来。"},{"title":"谈判筹码","text":"外部可见度是市场价值的证据。手上有多个机会，就有更好的替代方案（BATNA，出自 Fisher 与 Ury 的《谈判力》），谈判也更有底气。"},{"title":"转型跳板","text":"在新领域“公开学习”，提前积累新领域的信任证据。真正转型时，就不是从零开始。"}]},{"type":"h","text":"内部品牌：在公司里被看见"},{"type":"list","items":["让成果可见：定期向上同步进展，用数据说明影响。","成为某个主题的“内部专家”：做内部分享、写内部文档、回答同事的问题。","参与跨部门项目，扩大内部的弱连接网络。","帮助别人成功：带新人、为同事背书。你的口碑是由别人传播的。"]},{"type":"h","text":"员工的个人品牌与雇主"},{"type":"compare","left":{"title":"需要避免","items":["泄露未公开的信息或客户数据","以公司名义发表个人观点","公开抱怨同事与客户","与雇主业务产生利益冲突"]},"right":{"title":"双赢做法","items":["分享行业洞察与专业方法","在合规的前提下展示团队成果","帮公司吸引人才与客户","参与公司的员工倡导计划"]}},{"type":"checklist","id":"career-moves","title":"职业杠杆行动","items":["简历和求职资料附上作品集或主页链接","LinkedIn 或脉脉的资料与你的定位一致","每季度至少做一次内部分享","维护一份“成就清单”，晋升和面试时随时可用","与 3 位以上猎头或行业伙伴保持联系"]}]},{"id":"business","title":"商业与获客","en":"Business","lead":"对自由职业者、顾问和创业者来说，个人品牌是成本最低的获客渠道。","reviewed":"2026-10-10","blocks":[{"type":"h","text":"内容获客漏斗"},{"type":"steps","items":[{"title":"吸引","text":"在公开平台持续输出有价值的内容。"},{"title":"捕获","text":"用“引流磁铁”（免费模板、清单、电子书、小课）把关注者引导到自有阵地。"},{"title":"培育","text":"通过 Newsletter 和社群持续提供价值，建立信任。"},{"title":"转化","text":"给出明确的下一步：预约咨询、试用或购买。"},{"title":"交付与推荐","text":"超预期交付，收集评价，鼓励推荐。"}]},{"type":"h","text":"品牌带来的三种商业优势"},{"type":"cards","cols":3,"items":[{"title":"获客成本更低","text":"内容持续带来主动咨询，减少对广告和冷启动销售的依赖。"},{"title":"定价权更高","text":"专家定位带来溢价，客户愿意为“确定性”付费。"},{"title":"客户更匹配","text":"清晰的定位会吸引对的客户，也会劝退不合适的客户。"}]},{"type":"h","text":"创始人品牌"},{"type":"p","text":"对创业者来说，创始人的个人品牌能降低早期获客成本、帮助招聘，也能增强投资人和合作伙伴的信任。越来越多的企业家亲自做内容，看中的正是这一点。"},{"type":"compare","mode":"neutral","left":{"title":"收益","items":["早期信任与获客","吸引认同理念的人才","更容易获得媒体和投资人关注","产品发布时自带声量"]},"right":{"title":"风险与对策","items":["关键人风险：逐步建立公司品牌和团队品牌","言论风险：建立发布前审核和危机预案","精力分散：设定可持续的节奏，必要时引入内容团队"]}},{"type":"callout","tone":"tip","title":"B2B 社交销售","text":"在 B2B 业务中，决策者往往会先看你的公开内容，再决定要不要见面。持续分享行业洞察、客户案例与方法论，能明显缩短建立信任的过程。"}]},{"id":"monetize","title":"变现模式","en":"Monetize","lead":"变现是信任的自然结果，不是目的本身。先服务，后产品；先验证，后放大。","reviewed":"2026-10-10","blocks":[{"type":"table","caption":"变现模式全景","head":["模式","受众门槛","可扩展性","时间投入","适合谁"],"rows":[["咨询 / 顾问","低","低","高","有深度专业经验的人"],["教练 / 辅导","低","低","高","擅长陪伴与引导的人"],["自由职业服务","低","低","高","设计、开发、写作等技能型人才"],["演讲 / 企业内训","中","中","中","表达能力强、有方法论的人"],["数字产品（模板、电子书、工具）","中","高","前期高、后期低","能把经验产品化的人"],["在线课程 / 训练营","中","高","中–高","擅长系统教学的人"],["付费社群 / 会员","中","中","持续投入","擅长组织与运营的人"],["付费订阅内容","中–高","高","持续投入","能稳定输出深度内容的人"],["品牌合作 / 广告","高","中","中","有稳定受众和鲜明调性的人"],["联盟营销 / 带货","中–高","高","中","有选品能力和信任基础的人"],["出版","中","中","高","有体系化内容的人"],["顾问 / 股权合作","低（但需要很高的信任）","中","低–中","资深行业专家"]]},{"type":"h","text":"价值阶梯"},{"type":"diagram","kind":"ladder","title":"价值阶梯","caption":"价值阶梯让不同信任程度、不同预算的人都能找到合适的下一步。价格只是示意，实际取决于领域与市场。","data":{"steps":[{"label":"免费内容","text":"文章、视频、播客","price":"¥0"},{"label":"引流品","text":"模板、小课、电子书","price":"¥9–99"},{"label":"核心产品","text":"课程、训练营、会员","price":"¥299–2999"},{"label":"高端服务","text":"咨询、陪跑、企业服务","price":"¥5000+"},{"label":"顶级合作","text":"年度顾问、私董会、股权合作","price":"定制"}]}},{"type":"h","text":"1000 个铁杆粉丝"},{"type":"p","text":"Kevin Kelly 在《1,000 True Fans》（2008）中提出：一位创作者只要拥有 **1000 个铁杆粉丝**，每人每年为你的作品花 100 美元，就能获得体面的收入。Li Jin 在 2020 年进一步提出“100 个铁杆粉丝”：产品更高端时，100 位每年付费 1000 美元的用户同样可行。关键不在粉丝总数，而在**直接关系**和**付费深度**。"},{"type":"tool","id":"money"},{"type":"h","text":"什么时候可以开始变现"},{"type":"list","style":"check","items":["有人主动问：“你有没有付费服务或课程？”","反复被问到同一类问题","有一批稳定互动的核心受众","有可以展示的成功案例或学员反馈"]},{"type":"h","text":"定价与验证"},{"type":"list","items":["**先服务后产品**：先做一对一咨询，验证需求、打磨方法，再产品化。","**预售验证**：先发布介绍页收集预订，达到目标再制作，降低风险。","**按价值定价**：参考客户获得的结果，而不是你花的时间。","**涨价信号**：档期长期排满、成交率过高（比如超过 80%），通常说明价格偏低。"]},{"type":"callout","tone":"warn","title":"变现红线","text":"只推荐你真正用过、认可的产品；清晰披露合作关系；不夸大效果，不做无法兑现的承诺；不利用受众的焦虑。"}]},{"id":"influence","title":"影响力","en":"Influence","lead":"当你的观点被引用、方法被采用、名字被推荐，品牌就从“被看见”升级为“有影响”。","reviewed":"2026-10-10","blocks":[{"type":"cards","cols":3,"items":[{"title":"思想领导力","text":"提出原创观点与框架，并给它起一个好记的名字。被命名的方法更容易被传播和引用。"},{"title":"演讲","text":"从内部分享、线下沙龙到行业大会，逐级升级。每次演讲都录像，切片复用。"},{"title":"播客与媒体","text":"做嘉宾比自己做节目门槛低。准备好媒体资料包，成为“可被引用的专家”。"},{"title":"出版","text":"书是终极信任状。先用文章和课程验证内容，再体系化出版。"},{"title":"合作与联名","text":"跨界合作、联合产品、共同办活动，借彼此的受众放大影响。"},{"title":"倡导与公益","text":"用影响力推动你在乎的事。由价值观驱动的品牌更有生命力。"}]},{"type":"h","text":"演讲者资料包（Speaker Kit）"},{"type":"list","items":["50 字和 150 字两版第三人称介绍","2–3 张高清照片（横版、竖版各备一张）","3–5 个可讲的话题，每个附一句话摘要","过往演讲的视频链接和听众评价","技术要求与联系方式"]},{"type":"checklist","id":"influence-steps","title":"影响力进阶清单","items":["为你的核心方法论起一个名字","完成第一次公开分享（线上或线下）","准备好演讲者或媒体资料包","主动申请 3 个播客或媒体露出机会","发布一份原创研究或数据报告"]}]},{"id":"assetize","title":"资产化","en":"Assetize","lead":"让品牌在你不在场时也能工作：把注意力变成资产，把个人变成系统。","reviewed":"2026-10-10","blocks":[{"type":"cards","cols":2,"items":[{"title":"从注意力到资产","text":"邮件列表、社群、常青内容库、课程、书、开源项目、注册商标，这些都不依赖平台算法。"},{"title":"从个人到系统","text":"方法论产品化、标准作业流程、助理与团队，以及邮件序列、预约系统、交付流程等自动化。"},{"title":"从单一到组合","text":"多平台、多收入来源、多种产品形态，降低任何一个环节失效带来的冲击。"},{"title":"从品牌到股权","text":"以顾问或合伙人身份参与项目，或孵化自己的产品与公司，把信任转化为长期权益。"}]},{"type":"h","text":"品牌资产健康度三问"},{"type":"list","style":"number","items":["**可迁移**：如果主平台明天关停，你还能联系到多少受众？","**可持续**：如果最大的收入来源消失，你还能维持多久？","**可复制**：如果你休息一个月，品牌和收入还能运转吗？"]},{"type":"h","text":"风险清单"},{"type":"table","head":["风险","表现","对策"],"rows":[["平台依赖","流量和收入集中在单一平台","建设自有阵地，多平台分发"],["收入集中","单一客户或单一产品占比过高","构建价值阶梯与多元收入"],["关键人","一切都依赖你本人的时间","产品化、团队化、系统化"],["声誉","一次失误可能毁掉多年积累","发布审核、危机预案、守住底线"]]},{"type":"callout","tone":"insight","title":"飞轮回到起点","text":"资产化带来的案例、收入、关系和影响力，会成为下一轮“建立”的燃料：更强的信任状、更清晰的定位、更大的平台。回到 [[build|建立]]，开始新的一圈。"}]}]}},"playbooks":{"id":"playbooks","title":"角色路线","en":"Playbooks","kicker":"按身份选打法","summary":"身份不同，打法不同。选择最接近你的角色，查看推荐的定位方式、平台组合、内容支柱、关键动作与利用路径。示例人物均为虚构。","reviewed":"2026-10-10","personas":[{"id":"professional","name":"职场专业人士","who":"在职 3–15 年，希望晋升、跳槽或建立行业影响力","goal":"职业机会","time":"每周 2–4 小时","example":"一位有 8 年经验的供应链经理，定位为“用数据优化供应链的实战派”。","positioning":"【行业】+【职能】+【方法或视角】，例如“制造业供应链的数据化实践者”。","platforms":["LinkedIn / 脉脉：职业身份与行业连接","知乎 / 公众号：深度内容","行业社群与线下活动"],"pillars":["工作方法与框架","行业观察与案例复盘","职业成长经验"],"actions":["完善职业平台资料，统一简介与头像","每周 1–2 篇工作方法或案例复盘","每季度做一次内部或行业分享","与 20 位行业同行建立联系"],"leverage":["猎头主动联系与内推","晋升答辩中的外部影响力证据","行业演讲与顾问机会"],"pitfalls":["泄露公司信息或客户数据","只转发、不原创","忽视公司内部的品牌"]},{"id":"developer","name":"技术开发者","who":"工程师、数据科学家、设计开发者","goal":"技术影响力与职业机会","time":"每周 3–6 小时","example":"一位前端工程师，定位为“专注 Web 性能优化的工程师”。","positioning":"【技术栈或领域】+【具体问题】，例如“帮团队把 Web 应用提速的性能工程师”。","platforms":["GitHub：作品集与开源项目","技术博客 / 掘金 / 个人网站：深度文章","X / 即刻：技术圈连接"],"pillars":["技术深度文章与踩坑记录","开源项目与工具","技术趋势与 AI 工作流"],"actions":["维护 1 个有清晰 README 的开源项目","每月 1–2 篇技术深度文章","在技术会议或 meetup 做一次分享","积极参与开源社区的 issue 与讨论"],"leverage":["大厂与创业公司的主动邀约","技术顾问与外包项目","开发者关系（DevRel）、技术写作等新职业路径"],"pitfalls":["只写入门教程，缺乏深度","项目没有文档，别人用不起来","陷入技术站队的争论"]},{"id":"freelancer","name":"自由职业者 / 顾问","who":"设计师、开发者、写作者、咨询顾问等独立工作者","goal":"稳定获客与提升客单价","time":"每周 4–8 小时（把它当成销售时间）","example":"一位独立品牌设计师，定位为“为新消费品牌做视觉系统的设计师”。","positioning":"【服务对象】+【交付成果】，例如“帮 SaaS 公司提升转化率的落地页文案顾问”。","platforms":["个人网站 + 作品集：自有阵地的核心","小红书 / LinkedIn：获客","行业垂直社区"],"pillars":["案例拆解与前后对比","行业方法论","客户常见问题解答"],"actions":["整理 5 个完整案例（背景、挑战、方案、结果）","设计 1 个引流磁铁（如免费自查清单）","梳理“询价、沟通、报价、成交”的流程","每个项目结束后收集客户评价"],"leverage":["主动询单与转介绍","提价与筛选客户","把服务产品化，开发课程"],"pitfalls":["什么活都接，导致定位模糊","作品集只放图、不讲成果","忙时不做品牌，闲时没有客户"]},{"id":"creator","name":"内容创作者","who":"以内容为主业或重要副业的创作者","goal":"受众增长与内容变现","time":"每周 10 小时以上","example":"一位职场成长类视频博主，定位为“帮年轻人建立工作方法的职场博主”。","positioning":"【人群】+【领域】+【风格】，例如“用漫画讲经济学的科普作者”。","platforms":["主阵地：B站、抖音、小红书、YouTube 中选一个","分发：其他视频或图文平台","自有：Newsletter 或私域社群"],"pillars":["栏目化的核心内容","热点与观点","幕后与个人生活"],"actions":["确定 1–2 个固定栏目和更新节奏","每周复盘数据，迭代选题与开头","建立自有阵地，沉淀核心粉丝","达到一定规模后入驻平台官方的商单平台"],"leverage":["品牌合作与广告","课程、社群、周边等自有产品","平台激励与直播"],"pitfalls":["过度依赖单一平台","为了流量牺牲调性与信任","只追热点，没有沉淀"]},{"id":"founder","name":"创业者 / 创始人","who":"创业公司的创始人、联合创始人","goal":"获客、招聘、融资与行业影响力","time":"每周 3–5 小时（可以借助团队）","example":"一家 AI 工具创业公司的 CEO，定位为“在一线实践 AI 落地的创业者”。","positioning":"【使命或信念】+【行业洞察】，例如“相信小团队也能做出伟大产品的创业者”。","platforms":["X / LinkedIn / 即刻：行业与投资圈","视频号 / 公众号：国内用户与合作方","播客嘉宾与行业大会"],"pillars":["公开构建：产品进展与决策思考","行业洞察与用户故事","团队文化与招聘"],"actions":["每周分享一次产品或公司进展","每月接受一次播客或媒体采访","建立发布前审核与危机预案","让核心团队成员也建立专业品牌"],"leverage":["早期用户与种子客户","吸引认同使命的人才","投资人与合作伙伴的信任"],"pitfalls":["个人言论给公司带来风险","只做宣传，不分享真实的思考","公司过度依赖创始人个人"]},{"id":"student","name":"学生 / 职场新人","who":"在校学生、毕业 0–3 年的职场新人","goal":"第一份好工作与早期积累","time":"每周 2–5 小时","example":"一位计算机专业研究生，定位为“记录大模型应用开发学习过程的学习者”。","positioning":"公开学习者：“正在学习【领域】并分享实践的人”。","platforms":["GitHub / 作品集网站：能力证明","小红书 / 知乎 / B站：学习记录","LinkedIn：求职"],"pillars":["学习笔记与资源整理","项目实践与复盘","求职与成长经历"],"actions":["每完成一个项目就写一篇复盘","建立一个作品集主页","参加比赛、黑客松或开源项目","主动联系 10 位目标行业的从业者请教"],"leverage":["实习与校招的加分项","内推与导师关系","早期的副业与自由职业机会"],"pitfalls":["只收藏、不实践","过度包装、夸大经历","怕暴露“不专业”而迟迟不开始"]},{"id":"executive","name":"企业高管","who":"企业中高层管理者、部门负责人","goal":"行业影响力、企业品牌与人才吸引","time":"每周 1–3 小时（可以借助团队）","example":"一家制造企业的数字化负责人，定位为“传统企业数字化转型的实践者”。","positioning":"【行业】+【变革主题】，例如“推动零售业数字化的经营者”。","platforms":["LinkedIn / 公众号 / 视频号：思想领导力","行业大会与论坛","商业媒体与播客"],"pillars":["管理思考与领导力","行业趋势与战略判断","团队与组织建设"],"actions":["每月 1–2 篇有观点的深度文章（可以团队协作，但观点必须是自己的）","每季度至少一次行业演讲","与公关、法务部门对齐发布流程","建立核心观点库，保持表达一致"],"leverage":["行业话语权与合作机会","雇主品牌与人才吸引","董事会、顾问与投资机会"],"pitfalls":["内容全部由团队代笔，失去个人温度","在敏感议题上未经审慎地表态","个人品牌与企业立场冲突"]},{"id":"switcher","name":"转型者","who":"计划转行、转岗，或从职场转向自由职业的人","goal":"在新领域建立信任","time":"每周 3–6 小时","example":"一位从教师转型做教育产品经理的人，定位为“懂一线教学的教育产品人”。","positioning":"【原领域】×【新领域】，把过去的经验变成新领域的独特优势。","platforms":["新领域从业者聚集的平台","LinkedIn / 脉脉：职业身份","个人网站：转型作品集"],"pillars":["新领域的公开学习记录","原领域经验在新领域的应用","转型的思考与经历"],"actions":["写一篇转型宣言，说明原因与目标","用 2–3 个实践项目证明新能力","主动结识新领域的 20 位从业者","每月更新一次转型进展"],"leverage":["新领域的入门机会与内推","跨界视角带来的差异化","转型经验本身也可以成为内容和产品"],"pitfalls":["否定或隐藏过去的经验","只学习、不输出","急于求成，频繁更换方向"]}]},"tools":{"catalog":[{"id":"audit","name":"品牌体检","icon":"radar","stage":"neutral","desc":"7 个维度、21 道题，生成品牌雷达图与改进建议，可保存历史并对比。","home":"overview.howto"},{"id":"archetype","name":"品牌原型","icon":"persona","stage":"build","desc":"从 12 种品牌原型中选出主、辅原型，确定语调与内容风格。","home":"build.discover"},{"id":"canvas","name":"定位画布","icon":"target","stage":"build","desc":"填写 11 个字段，自动生成定位陈述、三种简介和电梯演讲。","home":"build.position"},{"id":"niche","name":"领域评估","icon":"bars","stage":"build","desc":"按热爱、擅长、需求、变现、竞争、持久性为候选领域打分排序。","home":"build.position"},{"id":"platform","name":"平台选择器","icon":"layers","stage":"build","desc":"回答 6 个问题，从 22 个平台中匹配主阵地与分发阵地。","home":"build.platform"},{"id":"calendar","name":"内容日历","icon":"calendar","stage":"build","desc":"设定内容支柱与发布节奏，生成 4 周日历，并管理选题池。","home":"build.content"},{"id":"roadmap","name":"90 天计划","icon":"flag","stage":"build","desc":"四个阶段、21 项任务的冷启动路线图，自动定位当前周次。","home":"build.launch"},{"id":"metrics","name":"指标仪表盘","icon":"chart","stage":"maintain","desc":"按月记录关键指标，查看趋势、环比与北极星指标。","home":"maintain.measure"},{"id":"crisis","name":"危机应对","icon":"shield","stage":"maintain","desc":"回答几个问题，得到应对步骤与声明模板。","home":"maintain.reputation"},{"id":"money","name":"变现计算器","icon":"coins","stage":"leverage","desc":"铁杆粉丝测算与价值阶梯规划，估算月收入。","home":"leverage.monetize"},{"id":"advisor","name":"品牌顾问","icon":"chat","stage":"neutral","desc":"结合你的定位画布与体检结果，向 Claude 提问（在 Claude 中打开时可用）。","home":"tools"},{"id":"plan","name":"我的方案","icon":"file","stage":"neutral","desc":"把所有工具的结果汇总成一份可导出的个人品牌战略书。","home":"plan"}],"audit":{"scale":["完全不符合","较不符合","一般","较符合","完全符合"],"dimensions":[{"id":"clarity","name":"清晰度","en":"Clarity","desc":"别人能否一句话说清你是谁、做什么","link":"build.position","questions":["我能用一句话（30 字以内）说清我帮助谁、解决什么问题。","认识我的人向别人介绍我时，说法基本一致。","我清楚目标受众是谁，能描述他们的需求与痛点。"],"tips":["用定位画布写出一句话定位","做一次他人反馈调查，看看别人如何描述你","把目标受众具体到一个真实的人"]},{"id":"distinct","name":"差异度","en":"Distinctiveness","desc":"与同类相比，你的独特之处","link":"build.position","questions":["我能说出自己与同领域其他人的明确区别。","我有独特的经历、方法或技能组合，并且在内容中体现了出来。","我的内容有可辨识的风格或观点，而不是泛泛而谈。"],"tips":["盘点你的技能叠加组合","给你的方法论起一个名字","在内容中多加入亲身经历和独立观点"]},{"id":"consistency","name":"一致性","en":"Consistency","desc":"形象、信息与节奏是否稳定","link":"maintain.consistency","questions":["我在所有平台上使用统一的名字、头像和简介。","我能按固定节奏持续输出（过去 3 个月没有长期断更）。","我的内容始终围绕核心定位，很少跑题。"],"tips":["完成账号装修清单","定一个最小可持续节奏，写进日历","储备 2 周存稿"]},{"id":"credibility","name":"可信度","en":"Credibility","desc":"作品、案例、评价与背书","link":"build.identity","questions":["我有能公开展示的作品、案例或成果。","我有来自他人的评价、推荐或第三方背书。","我分享的内容准确可靠，有经验或数据支撑。"],"tips":["整理 3–5 个代表作或案例","每次合作后主动收集评价","发布一篇基于亲身实践的深度内容"]},{"id":"visibility","name":"可见度","en":"Visibility","desc":"在目标人群中被看见、被搜到","link":"maintain.reputation","questions":["在搜索引擎或 AI 助手中搜索我的名字，能找到准确的信息。","我在目标受众聚集的平台上有稳定的曝光。","我曾通过演讲、媒体、播客或合作获得外部曝光。"],"tips":["做一次数字足迹自查","用平台选择器重新确认主阵地","每季度争取一次外部露出"]},{"id":"connection","name":"连接度","en":"Connection","desc":"互动、关系网络与自有阵地","link":"maintain.community","questions":["我会认真回复评论与私信，与受众保持互动。","我有一个可以互相支持、合作的同行网络。","我有自有阵地（邮件列表、社群等），可以直接联系到受众。"],"tips":["发布后 1 小时内回复评论","每周主动联系 1–2 位同行","建立邮件订阅或社群"]},{"id":"conversion","name":"转化度","en":"Conversion","desc":"品牌带来的实际机会与收入","link":"leverage.monetize","questions":["我的品牌曾为我带来工作、客户、合作或收入。","别人知道如何与我合作或购买我的服务。","我有清晰的价值阶梯或机会漏斗，而不是等机会偶然出现。"],"tips":["在所有主页加上清晰的合作入口","设计一个引流磁铁","用变现计算器规划价值阶梯"]}],"levels":[{"min":0,"name":"隐形期","text":"你可能很有能力，但还没有被对的人看见。先从定位和最小可行 24 小时内）发布正式回应"],"template":"我已注意到关于【事件】的讨论，正在认真核实相关情况，将于【时间】前公开说明。感谢大家的关注与耐心。"},"minor":{"title":"简短认错，立即修正","tone":"tip","steps":["承认错误，不找借口","公开更正内容（附更正说明，不要悄悄删除）","感谢指出问题的人","记录到复盘里，避免再犯"],"template":"感谢指正！这里我写错了：【错误内容】，正确的是【正确信息】。已在原文更正，抱歉给大家带来困扰。"},"apology":{"title":"正式道歉四步","tone":"warn","steps":["承认：具体说明哪里做错了","承担：不推卸责任，不说“如果冒犯到了”","改正：说明已经采取和将要采取的措施","跟进：在承诺的时间内公开进展"],"template":"关于【事件】，我想郑重道歉。我在【具体行为】上犯了错，给【受影响的人】造成了【影响】，这完全是我的责任。我已经【已采取的措施】，接下来会【后续措施】，并在【时间】前向大家同步进展。"},"major":{"title":"立即寻求专业支持","tone":"warn","steps":["暂停公开发言，避免二次伤害","咨询律师及相关专业人士","优先处理对受影响者的补救","在专业建议下发布正式声明","配合相关部门与平台的处理"],"template":"","note":"这类情况请不要自行起草声明，应在专业人士的指导下处理。"},"clarify":{"title":"平和澄清","tone":"tip","steps":["一次性、清晰地给出事实和证据","语气平和，不指责提问的人","必要时置顶澄清内容","澄清之后不再反复争辩"],"template":"看到一些关于【事情】的讨论，这里统一说明一下：【事实】。相关的【证据或链接】在这里。如果还有疑问，欢迎私信我。"},"rumor":{"title":"留证、举报、不纠缠","tone":"note","steps":["截图并保存证据（包括链接与时间）","通过平台的举报与投诉渠道处理","如果造成实际损害，咨询律师，依法维权","不和造谣者对骂，必要时发布一次简短声明","照顾好自己的情绪，必要时暂停查看评论"],"template":"近期网络上出现了关于我的不实信息：【谣言内容】。该信息与事实不符，我已保存证据并向平台举报，必要时将依法维权。感谢大家的信任与支持。"}}},"ai":{"canvasReview":"你是一位资深的个人品牌战略顾问，熟悉中文互联网与职场语境。请评估下面这份个人品牌定位画布，语言为简体中文，评价要具体、直接、可执行，不要空泛的鼓励。\n\n定位画布：\n{canvas}\n\n只输出一个 JSON 对象，字段如下：score（0–100 的整数，表示定位的清晰度与独特性）、verdict（一句话总评，30 字以内）、strengths（字符串数组，2–3 条优点）、issues（字符串数组，2–4 条具体问题）、statements（字符串数组，3 条改进后的一句话定位，每条 40 字以内）、bio（一句话简介，40 字以内）、next（字符串数组，3 条下一步行动）。","topics":"你是一位擅长中文内容策划的编辑。请根据下面的个人品牌信息，为下个月生成 10 个具体的内容选题。选题要贴合定位与受众，避免空泛的标题，适当使用数字、具体场景或反常识角度。\n\n品牌信息：\n{profile}\n\n内容支柱：{pillars}\n主要平台与形式：{channels}\n已有选题（避免重复）：{existing}\n\n只输出一个 JSON 数组，每个元素包含：title（选题标题，30 字以内）、pillar（必须是上面列出的某个内容支柱名称）、format（内容形式）、hook（开头第一句话，40 字以内）。","auditPlan":"你是一位个人品牌教练。下面是用户的品牌体检结果（每个维度满分 5 分）以及他的品牌档案。请给出一份为期 30 天、按周拆分的改进计划，优先补齐得分最低的维度。\n\n体检结果：\n{scores}\n\n品牌档案：\n{profile}\n\n要求：简体中文，Markdown 格式；先用 2–3 句话诊断，再按“第 1 周”到“第 4 周”列出每周 3 个具体行动（写清做什么、做到什么程度），最后给出 3 个用来衡量进展的指标。总长度控制在 600 字以内。","crisisDraft":"你是一位危机公关顾问。用户遇到了一次公开的负面事件，情况描述和已选择的处理路径如下。请帮他起草一份对外回应，同时指出需要注意的风险。\n\n处理路径：{path}\n情况描述：{situation}\n\n要求：简体中文；先给出回应正文（150–250 字，真诚、具体、不推卸、不攻击他人、不做无法兑现的承诺），再用 3 条以内的要点列出发布前要确认的事项。如果情况涉及违法、人身安全或严重伤害，请明确建议先咨询律师等专业人士，不要直接发布。不要编造用户没有提供的事实，用【】标出需要用户补充的信息。","advisor":"你是一位务实的个人品牌顾问，帮助用户建立、维护和利用个人品牌。请用简体中文回答，先给结论，再给具体可执行的步骤，避免空话；不确定的地方直接说明。涉及法律、税务或投资的问题，只提供一般性信息并建议咨询专业人士。不要编造数据、案例或引用来源。\n\n以下是用户的品牌档案（可能不完整）：\n{profile}","suggestions":["帮我评估一下现在的定位","给我 5 个本周就能写的选题","我适合哪些变现方式？","不想露脸，怎样建立信任？"]}},"resources":{"id":"resources","title":"资源与术语","en":"Resources","kicker":"延伸阅读","summary":"本指南引用的书籍与文章、常用术语表，以及常见问题解答。","reviewed":"2026-10-10","books":[{"title":"Positioning: The Battle for Your Mind","zh":"定位","author":"Al Ries, Jack Trout","year":1981,"tag":"定位","why":"理解“心智占位”的经典，定位理论的源头。"},{"title":"Crossing the Chasm","zh":"跨越鸿沟","author":"Geoffrey Moore","year":1991,"tag":"定位","why":"定位陈述模板的出处，讲清如何先占领细分市场。"},{"title":"This Is Marketing","zh":"这才是营销","author":"Seth Godin","year":2018,"tag":"定位","why":"从“最小可行受众”出发，为特定的人创造改变。"},{"title":"Purple Cow","zh":"紫牛","author":"Seth Godin","year":2003,"tag":"差异化","why":"与众不同才会被注意到。"},{"title":"Show Your Work!","author":"Austin Kleon","year":2014,"tag":"内容","why":"通过分享创作过程被发现，适合不想“自我营销”的人。"},{"title":"Building a StoryBrand","author":"Donald Miller","year":2017,"tag":"识别","why":"用七段式故事框架讲清你的价值，让受众成为主角。"},{"title":"Made to Stick","zh":"让创意更有粘性","author":"Chip Heath, Dan Heath","year":2007,"tag":"内容","why":"让观点被记住的六个原则。"},{"title":"Contagious","zh":"疯传","author":"Jonah Berger","year":2013,"tag":"传播","why":"内容为什么会被分享，以及如何设计可传播的内容。"},{"title":"Influence","zh":"影响力","author":"Robert Cialdini","year":1984,"tag":"心理","why":"理解信任与说服背后的心理学原理。"},{"title":"Start With Why","zh":"从“为什么”开始","author":"Simon Sinek","year":2009,"tag":"使命","why":"用使命与信念驱动品牌，而不只是罗列能力。"},{"title":"Stand Out","author":"Dorie Clark","year":2015,"tag":"影响力","why":"如何找到自己的突破性观点，成为公认的专家。"},{"title":"Reinventing You","author":"Dorie Clark","year":2013,"tag":"转型","why":"职业重塑与个人品牌转型的实操指南。"},{"title":"Company of One","zh":"一个人的公司","author":"Paul Jarvis","year":2019,"tag":"变现","why":"不追求规模扩张的小而美商业。"},{"title":"Building a Second Brain","zh":"打造第二大脑","author":"Tiago Forte","year":2022,"tag":"系统","why":"用 CODE 方法管理知识与素材，支撑长期输出。"},{"title":"The Almanack of Naval Ravikant","zh":"纳瓦尔宝典","author":"Eric Jorgenson","year":2020,"tag":"杠杆","why":"整理了 Naval 关于杠杆、长期主义与财富的观点。"},{"title":"Designing Your Life","zh":"斯坦福大学人生设计课","author":"Bill Burnett, Dave Evans","year":2016,"tag":"自我认知","why":"用设计思维探索职业与人生方向。"},{"title":"Duct Tape Marketing","author":"John Jantsch","year":2007,"tag":"营销","why":"营销沙漏（知道、喜欢、信任、尝试、购买、复购、推荐）的出处。"},{"title":"Perennial Seller","author":"Ryan Holiday","year":2017,"tag":"作品","why":"如何打造能长期产生价值的作品。"},{"title":"Quiet","zh":"安静：内向性格的竞争力","author":"Susan Cain","year":2012,"tag":"性格","why":"内向者在深度思考与表达上的独特优势。"}],"essays":[{"title":"The Brand Called You","author":"Tom Peters","source":"Fast Company","year":1997,"why":"让“个人品牌”概念广为人知的早期名篇。"},{"title":"Managing Oneself","author":"Peter Drucker","source":"Harvard Business Review","year":1999,"why":"认识自己的优势、工作方式与价值观；反馈分析法的出处。"},{"title":"The Strength of Weak Ties","author":"Mark Granovetter","source":"American Journal of Sociology","year":1973,"why":"弱连接在获取新信息与新机会中的作用。"},{"title":"1,000 True Fans","author":"Kevin Kelly","source":"The Technium","year":2008,"why":"铁杆粉丝理论的原文。"},{"title":"1,000 True Fans? Try 100","author":"Li Jin","source":"a16z","year":2020,"why":"高客单价时代的铁杆粉丝理论修正。"},{"title":"Learn in Public","author":"swyx（Shawn Wang）","source":"个人博客","year":2018,"why":"公开学习的方法与理由。"},{"title":"How to Get Rich (without getting lucky)","author":"Naval Ravikant","source":"推文串与播客","year":2018,"why":"关于杠杆、特定知识与长期复利的经典论述。"},{"title":"Increase Your Luck Surface Area","author":"Jason Roberts","source":"个人博客","why":"“运气表面积”概念的出处。"}],"glossary":[{"term":"个人品牌","en":"Personal Brand","def":"你在特定人群心中，因为特定价值而被记住、信任和推荐的程度。"},{"term":"定位","en":"Positioning","def":"在目标人群心智中占据的清晰、独特、有价值的位置。"},{"term":"价值主张","en":"Value Proposition","def":"你为目标人群带来的核心价值与可感知的结果。"},{"term":"信任状","en":"Credibility Markers","def":"证明你值得信任的证据：作品、案例、评价、资质、背书等。"},{"term":"品牌原型","en":"Brand Archetype","def":"基于荣格原型理论的 12 种品牌人格，用来定义品牌个性与语调。"},{"term":"技能叠加","en":"Talent Stack","def":"多项“足够好”的技能组合在一起形成的稀缺性。"},{"term":"内容支柱","en":"Content Pillars","def":"长期稳定输出的 3–5 个核心主题。"},{"term":"内容原子化","en":"Content Atomization","def":"把一个深度内容拆解成多种形式，分发到多个平台。"},{"term":"自有阵地","en":"Owned Media","def":"完全由你掌控的渠道，如个人网站、邮件列表、私域社群。"},{"term":"租用阵地","en":"Rented Media","def":"第三方平台上的账号，规则由平台决定。"},{"term":"赢得阵地","en":"Earned Media","def":"来自他人的报道、推荐与口碑。"},{"term":"私域","en":"Private Traffic","def":"可以反复、直接触达的用户关系，如微信好友、社群、邮件列表。"},{"term":"引流磁铁","en":"Lead Magnet","def":"用来换取联系方式的免费资源，如模板、清单、电子书。"},{"term":"价值阶梯","en":"Value Ladder","def":"从免费到高端、逐级递进的产品与服务组合。"},{"term":"铁杆粉丝","en":"True Fans","def":"愿意持续为你的作品付费的核心支持者。"},{"term":"互动率","en":"Engagement Rate","def":"互动次数与曝光量（或粉丝数）之比。比较时要保持口径一致。"},{"term":"北极星指标","en":"North Star Metric","def":"最能反映当前阶段核心价值的单一指标。"},{"term":"公开学习","en":"Learn in Public","def":"在学习过程中公开分享笔记与实践，以输出促进成长。"},{"term":"公开构建","en":"Build in Public","def":"公开分享产品或事业的构建过程与数据。"},{"term":"思想领导力","en":"Thought Leadership","def":"以原创观点和方法影响行业的能力。"},{"term":"社交销售","en":"Social Selling","def":"通过社交平台上的内容与互动建立信任、促成销售。"},{"term":"员工倡导","en":"Employee Advocacy","def":"员工在社交平台分享与公司相关的内容，扩大企业影响。"},{"term":"生成式引擎优化","en":"GEO","def":"让你的内容和个人信息更容易被 AI 搜索与 AI 助手准确理解和引用。"},{"term":"媒体资料包","en":"Media Kit","def":"供媒体与合作方使用的简介、照片、话题与数据合集。"},{"term":"运气表面积","en":"Luck Surface Area","def":"你做的事与知道这件事的人数之积，决定机会出现的概率。"},{"term":"营销沙漏","en":"Marketing Hourglass","def":"知道 → 喜欢 → 信任 → 尝试 → 购买 → 复购 → 推荐的客户旅程模型。"}],"faq":[{"q":"内向的人适合做个人品牌吗？","a":"很适合。写作、播客、深度长文都是内向者的优势形式；个人品牌靠的是深度与真诚，而不是热闹。Susan Cain 的《安静》就讨论过内向者在深度思考上的优势。"},{"q":"不想露脸可以吗？","a":"可以。图文、长文、播客、代码、插画、不出镜的知识视频都能建立品牌。只是“人”的元素越少，建立信任越慢，可以用真实的经历、鲜明的观点和固定的视觉风格来弥补。"},{"q":"每周只有 2 小时怎么办？","a":"选一个主阵地、一种内容形式：每周发布一条高质量内容，再加 15 分钟互动。坚持一年，胜过三个月的高强度投入后放弃。"},{"q":"公司不允许员工做自媒体怎么办？","a":"先弄清公司政策的具体边界。通常不涉及公司信息的通用专业内容是允许的；也可以先从内部品牌、行业活动、线下分享做起。有疑问时，书面向 HR 或法务确认。"},{"q":"多久能看到效果？","a":"通常需要 6–12 个月的稳定投入，才能看到明显的机会回报；前 3 个月主要是找感觉、验证方向。把目标放在过程上（发布了多少、学到了什么），更容易坚持下去。"},{"q":"中途想换方向怎么办？","a":"很正常。用“桥接”内容平滑过渡，逐步调整主题比例，并公开讲述你的思考，参见 [[maintain.evolve|进化与转型]]。"},{"q":"要不要签 MCN 或找代运营？","a":"先自己跑通内容与定位，再考虑外部合作。签约前仔细审查分成比例、合约期限、账号归属和违约条款，避免失去对品牌的控制权。"},{"q":"AI 会让个人品牌失去意义吗？","a":"恰恰相反。AI 让通用信息变得廉价，而真实的经验、可信的判断和有温度的关系变得更稀缺。用 AI 提高效率，把精力留给只有你能提供的东西。"},{"q":"年龄大了还来得及吗？","a":"资历本身就是差异化。多年的行业经验、人脉与判断力，是年轻创作者难以复制的；很多领域的受众也更信任经验丰富的人。"},{"q":"被抄袭了怎么办？","a":"保留原创证据（发布时间、源文件），使用平台的原创保护与投诉功能；严重侵权时可以咨询律师。同时要明白：方法可以被模仿，但你的持续迭代和你与受众的关系无法被复制。"}]},"changelog":[{"version":"1.1.0","date":"2026-10-10","groups":[{"title":"新增","items":["公开在线版本：https://vx-zjr.github.io/personal-brand-flywheel/ ，由 GitHub Pages 托管；`.github/workflows/pages.yml` 在每次推送到 `main` 后自动校验、构建并部署。","许可证：内容采用 CC BY 4.0（`LICENSE-CONTENT`），代码采用 MIT（`LICENSE`）；页面页脚与“关于与更新”页显示许可证、源码仓库与在线版本地址。","公开版每节末尾增加“去 GitHub 提建议”，打开一条预填好页面位置的 Issue。","社交分享预览图（og.png）与搜索引擎元信息（canonical、Open Graph、Twitter Card）。"]},{"title":"变更","items":["README 重写：横幅、徽章、截图、内容地图、工具清单、架构图、部署与迭代说明。","构建脚本：复制 `src/assets/` 中的静态资源到 `dist/`，校验 `site.json` 中的仓库地址、在线地址与许可证字段。"]}]},{"version":"1.0.0","date":"2026-10-10","groups":[{"title":"新增","items":["四章正文：总览、建立（6 节）、维护（6 节）、利用（6 节），共 22 个小节。","12 个交互工具：品牌体检、品牌原型、定位画布、领域评估、平台选择器、内容日历、90 天计划、指标仪表盘、危机应对、变现计算器、品牌顾问、我的方案。","8 条角色路线：职场专业人士、技术开发者、自由职业者、内容创作者、创业者、学生、企业高管、转型者。","资源页：19 本书、8 篇文章、26 个术语、10 个常见问题。","全文搜索、阅读进度、可勾选清单、数据导出与导入。","在 Claude 中打开时：数据同步到个人私有存储、可调用 Claude 生成建议、可下载文件、可对每一节发表评论。","agent.md 迭代手册、内容校验与构建脚本（生成 Artifact 版与独立托管版）。"]}]}]}</script>

/* 00-core.js — 命名空间、DOM 工具、图标、行内标记、提示、复制与下载。
   所有模块通过全局 PB 通信；build.py 按文件名顺序拼接 src/js/*.js。 */
(function () {
  "use strict";
  const PB = (window.PB = window.PB || {});
  PB.host = window.PB_HOST || "standalone";
  PB.tools = {};
  PB.views = {};

  /* ---------- 事件 ---------- */
  const listeners = {};
  PB.on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); };
  PB.emit = (evt, data) => { (listeners[evt] || []).slice().forEach((fn) => { try { fn(data); } catch (e) { console.error(e); } }); };

  /* ---------- DOM ---------- */
  function appendKids(el, kids) {
    for (const k of kids.flat(Infinity)) {
      if (k === null || k === undefined || k === false) continue;
      el.append(k instanceof Node ? k : String(k));
    }
  }
  PB.h = function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const key of Object.keys(props)) {
        const v = props[key];
        if (v === null || v === undefined || v === false) continue;
        if (key === "class") el.className = v;
        else if (key === "text") el.textContent = v;
        else if (key === "html") el.innerHTML = v;
        else if (key === "style" && typeof v === "object") {
          for (const sk of Object.keys(v)) {
            if (sk.startsWith("--")) el.style.setProperty(sk, v[sk]);
            else el.style[sk] = v[sk];
          }
        } else if (key === "dataset") Object.assign(el.dataset, v);
        else if (key.startsWith("on") && typeof v === "function") el.addEventListener(key.slice(2), v);
        else if (key === "value" && ("value" in el)) el.value = v;
        else if (key === "checked") el.checked = !!v;
        else if (v === true) el.setAttribute(key, "");
        else el.setAttribute(key, v);
      }
    }
    appendKids(el, kids);
    return el;
  };
  const SVGNS = "http://www.w3.org/2000/svg";
  PB.s = function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    if (attrs) {
      for (const key of Object.keys(attrs)) {
        const v = attrs[key];
        if (v === null || v === undefined || v === false) continue;
        if (key === "text") el.textContent = v;
        else if (key.startsWith("on") && typeof v === "function") el.addEventListener(key.slice(2), v);
        else el.setAttribute(key, v);
      }
    }
    for (const k of kids.flat(Infinity)) if (k) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return el;
  };
  PB.$ = (sel, root) => (root || document).querySelector(sel);
  PB.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  PB.clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };
  PB.uid = (p) => (p || "id") + Math.random().toString(36).slice(2, 9);
  PB.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  PB.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  PB.today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  PB.fmt = (n, digits) => {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
    const d = digits === undefined ? (Math.abs(n) < 10 && n % 1 ? 1 : 0) : digits;
    return Number(n).toLocaleString("zh-CN", { maximumFractionDigits: d, minimumFractionDigits: 0 });
  };
  PB.money = (n) => "¥" + PB.fmt(Math.round(n), 0);
  PB.compact = (n) => {
    if (n === null || n === undefined || isNaN(n)) return "—";
    const a = Math.abs(n);
    if (a >= 1e8) return PB.fmt(n / 1e8, 1) + "亿";
    if (a >= 1e4) return PB.fmt(n / 1e4, 1) + "万";
    return PB.fmt(n);
  };

  /* ---------- 文本 ---------- */
  PB.esc = (str) => String(str === null || str === undefined ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 行内标记：**粗体**、`代码`、[[路由|文字]] 站内链接、[文字](https://…) 外链、换行。先转义，再替换。
  PB.md = function md(text) {
    let out = PB.esc(text);
    out = out.replace(/\[\[([a-z0-9.\-]+)\|([^\]]+)\]\]/g, (m, route, label) => '<a class="ilink" href="#' + route + '">' + label + "</a>");
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, label, url) => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\n/g, "<br>");
    return out;
  };
  PB.plain = (text) => String(text || "").replace(/\[\[[a-z0-9.\-]+\|([^\]]+)\]\]/g, "$1").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, "$1").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
  // 高亮模板中的【占位符】
  PB.markSlots = (text) => PB.esc(text).replace(/【([^】]*)】/g, "<mark>【$1】</mark>");

  // 块级 Markdown（用于渲染 AI 回答与方案预览）：标题、列表、表格、代码块、段落。
  PB.mdBlock = function mdBlock(src) {
    const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    const html = [];
    let i = 0;
    const inline = (t) => {
      let o = PB.esc(t);
      o = o.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, l, u) => '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + l + "</a>");
      o = o.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
      return o;
    };
    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }
      if (/^```/.test(line)) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        html.push("<pre><code>" + PB.esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      const hm = line.match(/^(#{1,4})\s+(.*)$/);
      if (hm) { const lv = Math.min(4, hm[1].length + 1); html.push("<h" + lv + ">" + inline(hm[2]) + "</h" + lv + ">"); i++; continue; }
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const row = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const head = row(line); i += 2;
        const body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(row(lines[i++]));
        html.push("<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" + body.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
        continue;
      }
      if (/^\s*([-*•]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d+[.)]\s+/.test(line);
        const items = [];
        while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
          i++;
        }
        const tag = ordered ? "ol" : "ul";
        html.push("<" + tag + ">" + items.map((t) => "<li>" + inline(t) + "</li>").join("") + "</" + tag + ">");
        continue;
      }
      const buf = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !/^\s*([-*•]|\d+[.)])\s+/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\s*\|/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      html.push("<p>" + buf.map(inline).join("<br>") + "</p>");
    }
    return html.join("");
  };

  /* ---------- 图标 ---------- */

      if (done) return ok();
      if (selectEl) {
        try {
          if (selectEl.select) selectEl.select();

  PB.canSave = () => !!(PB.cap && PB.cap.downloads) || !PB.inClaude;
  PB.saveFile = async function saveFile(filename, data, mime) {

        await PB.cap.downloads.save({ filename, data });

        else PB.toast("当前环境无法保存文件，请改用复制");
        return false;
      }
    }
    if (PB.inClaude) { PB.toast("当前环境无法保存文件，请改用复制"); return false; }
    const blob = new Blob([data], { type: (mime || "text/plain") + ";charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  };
  PB.saveBtn = function saveBtn(label, filename, getData, mime) {
    return PB.h("button", { class: "btn sm", type: "button", "data-cap": "save", hidden: !PB.canSave(), onclick: () => PB.saveFile(typeof filename === "function" ? filename() : filename, getData(), mime) }, PB.icon("download", "sm"), label);
  };

  /* 两步确认按钮（Artifact 中 confirm() 不可用） */
  PB.confirmBtn = function confirmBtn(label, armedLabel, onConfirm, cls) {
    let armed = false, timer;
    const btn = PB.h("button", { class: "btn sm danger " + (cls || ""), type: "button" }, PB.icon("trash", "sm"), label);
    btn.addEventListener("click", () => {
      if (!armed) {
        armed = true;
        btn.classList.add("armed");
        btn.lastChild.textContent = armedLabel || "再点一次确认";
        timer = setTimeout(() => { armed = false; btn.classList.remove("armed"); btn.lastChild.textContent = label; }, 3500);
        return;
      }
      clearTimeout(timer);
      armed = false;
      btn.classList.remove("armed");
      btn.lastChild.textContent = label;
      onConfirm();
    });
    return btn;
  };
})();

/* ==== 10-store.js ==== */
/* 10-store.js — 用户数据存储与运行时能力。
   数据形状：{ v: 1, updated: <毫秒时间戳>, items: { <key>: <value> } }
   1) 始终写入 localStorage（键 pb:v1）；2) 在 Claude 中打开且已登录时，
   同步到 db 的 data/users/<id>/workbook（每位用户私有，含页面所有者在内的其他人不可读）。
   修改存储结构时：提升 SCHEMA_VERSION，并在 migrate() 中写迁移逻辑（见 agent.md §12）。 */
(function () {
  "use strict";
  const PB = window.PB;
  const LS_KEY = "pb:v1";
  const PREF_KEY = "pb:prefs";
  const SCHEMA_VERSION = 1;
  const MAX_REMOTE_BYTES = 240 * 1024;

  PB.inClaude = !!(window.claude && typeof window.claude.use === "function");
  PB.cap = { db: null, user: null, uid: null, sample: null, downloads: null, comments: null };

  function readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed && typeof parsed === "object" ? parsed : null;
    } catch (e) { return null; }
  }
  function writeLocal(state) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }
  function migrate(state) {
    if (!state || typeof state !== "object") return { v: SCHEMA_VERSION, updated: 0, items: {} };
    if (!state.items || typeof state.items !== "object") state.items = {};
    if (!state.v) state.v = 1;
    // 未来版本：if (state.v < 2) { ...; state.v = 2; }
    state.v = SCHEMA_VERSION;
    return state;
  }

  let state = migrate(readLocal());
  const status = { mode: "local", remoteError: null };

  const store = {
    status,
    get(key, fallback) {
      return Object.prototype.hasOwnProperty.call(state.items, key) ? state.items[key] : fallback;
    },
    has(key) { return Object.prototype.hasOwnProperty.call(state.items, key); },
    set(key, value) {
      state.items[key] = value;
      touch();
    },
    update(key, fn, fallback) {
      const cur = store.get(key, fallback);
      const next = fn(cur === undefined ? fallback : cur);
      store.set(key, next);
      return next;
    },
    remove(key) {
      if (store.has(key)) { delete state.items[key]; touch(); }
    },
    all() { return JSON.parse(JSON.stringify(state)); },
    replaceAll(next) {
      state = migrate(JSON.parse(JSON.stringify(next)));
      state.updated = Date.now();
      writeLocal(state);
      scheduleRemote();
      PB.emit("store:replaced");
    },
    clear() {
      state = { v: SCHEMA_VERSION, updated: Date.now(), items: {} };
      writeLocal(state);
      scheduleRemote();
      PB.emit("store:replaced");
    },
    size() { try { return new Blob([JSON.stringify(state)]).size; } catch (e) { return JSON.stringify(state).length; } }
  };
  PB.store = store;

  const saveLocalSoon = PB.debounce(() => writeLocal(state), 300);
  function touch() {
    state.updated = Date.now();
    saveLocalSoon();
    scheduleRemote();
    PB.emit("store:changed");
  }

  /* ---------- 偏好（仅本机，不同步） ---------- */
  PB.prefs = {
    get(key, fallback) {
      try { const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); return key in p ? p[key] : fallback; } catch (e) { return fallback; }
    },
    set(key, value) {
      try { const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); p[key] = value; localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) { /* 忽略 */ }
    }
  };

  /* ---------- 远端同步（db，私有） ---------- */
  let remoteRef = null;
  let remoteBusy = false;
  let remoteDirty = false;
  let remoteDisabled = false;

  const scheduleRemote = PB.debounce(() => { remoteDirty = true; flushRemote(); }, 1500);

  async function flushRemote() {
    if (!remoteRef || remoteDisabled || remoteBusy || !remoteDirty) return;
    const body = JSON.parse(JSON.stringify(state));
    const bytes = JSON.stringify(body).length * 3; // 粗略上限（UTF-8 中文最多 3 字节）
    if (bytes > MAX_REMOTE_BYTES && store.size() > MAX_REMOTE_BYTES) {
      status.remoteError = "数据超过云端单个文档上限，仅保存在本浏览器";
      PB.emit("sync");
      return;
    }
    remoteBusy = true;
    remoteDirty = false;
    try {
      await remoteRef.set(body);
      status.mode = "cloud";
      status.remoteError = null;
    } catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument" || code === "not_granted" || code === "revoked" || code === "capability_disabled" || code === "capability_removed") {
        remoteDisabled = true;
        status.mode = "local";
        status.remoteError = "当前账户无法写入云端，数据仅保存在本浏览器";
      } else if (code === "quota_exceeded") {
        status.remoteError = "云端存储已满，数据仅保存在本浏览器";
      } else {
        remoteDirty = true;
        setTimeout(flushRemote, 4000 + Math.random() * 3000);
      }
    } finally {
      remoteBusy = false;
      PB.emit("sync");
      if (remoteDirty && !remoteDisabled) setTimeout(flushRemote, 800);
    }
  }

  async function initRemote() {
    if (!PB.inClaude) return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { return; }
    PB.cap.db = db; PB.cap.user = user;
    if (!db || !user) return;
    let uid = null;
    try { uid = await user.id(); } catch (e) { uid = null; }
    if (!uid) return;
    PB.cap.uid = uid;
    try { remoteRef = db.doc("data/users/" + uid + "/workbook"); } catch (e) { remoteRef = null; return; }
    try {
      const snap = await remoteRef.get();
      const remote = snap && snap.exists ? snap.data() : null;
      if (remote && remote.items && (remote.updated || 0) > (state.updated || 0)) {
        state = migrate(JSON.parse(JSON.stringify(remote)));
        writeLocal(state);
        status.mode = "cloud";
        PB.emit("store:replaced");
      } else if (Object.keys(state.items).length) {
        remoteDirty = true;
        status.mode = "cloud";
        flushRemote();
      } else {
        status.mode = "cloud";
      }
    } catch (e) {
      status.remoteError = "暂时无法连接云端，数据先保存在本浏览器";
    }
    PB.emit("sync");
  }

  /* ---------- 其他能力 ---------- */
  function useCap(name) {
    if (!PB.inClaude) return Promise.resolve(null);
    try { return window.claude.use(name).catch(() => null); } catch (e) { return Promise.resolve(null); }
  }
  PB.initCaps = function initCaps() {
    useCap("sample").then((v) => { PB.cap.sample = v; PB.applyCaps(); });
    useCap("downloads").then((v) => { PB.cap.downloads = v; PB.applyCaps(); });
    useCap("comments").then((v) => { PB.cap.comments = v; PB.applyCaps(); });
    initRemote();
  };
  // 根据能力显示或隐藏带 data-cap 的元素。
  PB.applyCaps = function applyCaps(root) {
    const scope = root || document;
    PB.$$("[data-cap]", scope).forEach((el) => {
      const need = el.getAttribute("data-cap");
      let ok = false;
      if (need === "sample") ok = !!PB.cap.sample && !PB.aiDisabled;
      else if (need === "no-sample") ok = !PB.cap.sample || !!PB.aiDisabled;
      else if (need === "save") ok = PB.canSave();
      else if (need === "comments") ok = !!PB.cap.comments && !PB.commentsDisabled;
      el.hidden = !ok;
    });
    PB.emit("caps");
  };

  /* ---------- AI 调用封装 ---------- */
  const AI_ERRORS = {
    not_granted: "未获授权在此页面使用 Claude。",
    sampling_disabled: "当前账户无法使用 Claude。",
    not_declared: "此页面版本不支持调用 Claude。",
    capability_disabled: "此视图中无法调用 Claude。",
    capability_removed: "此视图中无法调用 Claude。",
    rate_limited: "请求太频繁，或已达到用量上限，请稍后再试。",
    session_expired: "登录已过期，请重新登录 Claude 后再试。",
    refused: "Claude 无法处理这个请求，请调整内容后再试。",
    empty_completion: "没有得到回答，请简化问题后再试。",
    invalid_json: "返回格式不完整，请再试一次。",
    prompt_too_large: "内容太长，请精简后再试。",
    upstream_error: "连接中断，请稍后重试。"
  };
  const AI_PERMANENT = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
  PB.aiErrorText = (e) => AI_ERRORS[(e && e.code) || "upstream_error"] || AI_ERRORS.upstream_error;
  PB.aiHandleError = (e) => {
    if (e && AI_PERMANENT.indexOf(e.code) >= 0) { PB.aiDisabled = true; PB.applyCaps(); }
  };
  PB.fill = (tpl, vars) => String(tpl).replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : ""));

  // 汇总用户的品牌档案，供 AI 提示词使用
  PB.profileText = function profileText() {
    const lines = [];
    const canvas = store.get("canvas");
    const T = PB.content.tools;
    if (canvas && canvas.fields) {
      T.canvas.fields.forEach((f) => { const v = (canvas.fields[f.id] || "").trim(); if (v) lines.push(f.label + "：" + v); });
    }
    const arch = store.get("archetype");
    if (arch && arch.primary) {
      const find = (id) => T.archetypes.find((a) => a.id === id);
      const p = find(arch.primary), s2 = arch.secondary && find(arch.secondary);
      lines.push("品牌原型：" + (p ? p.name : "") + (s2 ? "（辅：" + s2.name + "）" : ""));
    }
    const plat = store.get("platform");
    if (plat && PB.platformRank) {
      const top = PB.platformRank(plat).slice(0, 3).map((r) => r.p.name);
      if (top.length) lines.push("推荐平台：" + top.join("、"));
    }
    const audit = store.get("audit");
    if (audit && audit.history && audit.history.length) {
      const last = audit.history[audit.history.length - 1];
      lines.push("最近一次体检总分：" + last.total + "（" + last.date + "）");
    }
    return lines.length ? lines.join("\n") : "（用户尚未填写品牌档案）";
  };
})();

/* ==== 20-charts.js ==== */
/* 20-charts.js — 轻量 SVG 图表：雷达图、单序列折线图（小多图）、横向条形图，以及共享的悬停提示。
   规范（来自数据可视化准则）：2px 线、≥8px 端点、10% 面积填充、细网格、文字只用墨色、
   单序列不加图例、两个以上序列必须有图例、提示只做增强（数值另有直接标注或表格）。 */
(function () {
  "use strict";
  const PB = window.PB;
  const { h, s } = PB;

  /* ---------- 悬停提示 ---------- */
  const tip = {
    el: null,
    show(rows, x, y, head) {
      if (!this.el) { this.el = h("div", { class: "tooltip", role: "tooltip" }); document.body.append(this.el); }
      PB.clear(this.el);
      if (head) this.el.append(h("div", { class: "tt-head", text: head }));
      rows.forEach((r) => this.el.append(h("div", { class: "tt-row" }, r.key ? h("i", { class: "tt-key " + (r.key === "b" ? "b" : "") }) : null, h("span", { class: "tt-val", text: r.value }), r.label ? h("span", { text: r.label }) : null)));
      this.el.hidden = false;
      const w = this.el.offsetWidth, hgt = this.el.offsetHeight;
      let left = x + 14, top = y - hgt - 10;
      if (left + w > window.innerWidth - 8) left = x - w - 14;
      if (top < 8) top = y + 16;
      this.el.style.left = Math.max(8, left) + "px";
      this.el.style.top = top + "px";
    },
    hide() { if (this.el) this.el.hidden = true; }
  };
  PB.tip = tip;
  window.addEventListener("scroll", () => tip.hide(), { passive: true });

  function niceMax(v) {
    if (!(v > 0)) return 1;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / exp;
    const nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * exp;
  }
  PB.niceMax = niceMax;

  /* ---------- 雷达图 ----------
     opts: { dims: [{id, name}], series: [{name, values: {dimId: number}, cls: "a"|"b"}], max: 5 } */
  PB.radar = function radar(opts) {
    const W = 380, H = 330, cx = W / 2, cy = 168, R = 112;
    const dims = opts.dims, n = dims.length, max = opts.max || 5;
    const ang = (i) => (-90 + (i * 360) / n) * (Math.PI / 180);
    const pt = (i, v) => [cx + Math.cos(ang(i)) * (R * v) / max, cy + Math.sin(ang(i)) * (R * v) / max];
    const svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "chart radar", role: "img", "aria-label": opts.label || "品牌雷达图" });
    for (let lv = 1; lv <= max; lv++) {
      const pts = dims.map((d, i) => pt(i, lv).map((x) => x.toFixed(1)).join(",")).join(" ");
      svg.append(s("polygon", { points: pts, class: "grid" }));
    }
    dims.forEach((d, i) => {
      const [x, y] = pt(i, max);

    const d = pts.map((p, i) => (i ? "L" : "M") + xAt(i).toFixed(1) + "," + yAt(+p.value).toFixed(1)).join(" ");
    if (pts.length > 1) {
      svg.append(s("path", { d: d + " L" + xAt(pts.length - 1).toFixed(1) + "," + yAt(0).toFixed(1) + " L" + xAt(0).toFixed(1) + "," + yAt(0).toFixed(1) + " Z", class: "area-a" }));
      svg.append(s("path", { d, class: "line series-a", fill: "none" }));

    const lx = xAt(pts.length - 1), ly = yAt(+last.value);
    svg.append(s("circle", { cx: lx.toFixed(1), cy: ly.toFixed(1), r: 4, class: "dot series-a" }));
    svg.append(s("text", { x: (lx + 6).toFixed(1), y: (ly + 4).toFixed(1), class: "label-strong", "font-size": "11.5", text: PB.compact(+last.value) + (opts.unit === "%" ? "%" : "") }));
    const cross = s("line", { x1: 0, x2: 0, y1: T, y2: T + ph, class: "crosshair", visibility: "hidden" });
    const hover = s("circle", { r: 4, class: "dot series-a", visibility: "hidden" });
    svg.append(cross, hover);
    const hit = s("rect", { x: L, y: T, width: pw, height: ph, class: "hit", tabindex: "0", "aria-label": (opts.title || "") + "：" + pts.map((p) => p.label + " " + PB.fmt(p.value)).join("，") });
    const at = (i, ev) => {
      const p = pts[i];
      const x = xAt(i), y = yAt(+p.value);

      hover.setAttribute("cx", x); hover.setAttribute("cy", y); hover.setAttribute("visibility", "visible");
      const rect = svg.getBoundingClientRect();
      const cxp = ev ? ev.clientX : rect.left + (x / W) * rect.width;
      const cyp = ev ? ev.clientY : rect.top + (y / H) * rect.height;
      tip.show([{ key: "a", value: PB.fmt(p.value) + (opts.unit || ""), label: opts.title || "" }], cxp, cyp, p.full || p.label);

    hit.addEventListener("pointermove", (ev) => {

  };

  /* ---------- 横向条形图（HTML） ----------

})();

/* ==== 44-tool-platform.js ==== */
/* 44-tool-platform.js — 平台选择器：6 个问题 → 22 个平台的匹配度排序 + 自有阵地建议 + 平台图谱。
   存储键 platform = { region, formats[], audiences[], goals[], time, face }。
   评分规则（便于在 agent.md 中调整）：基础 10 分 + 形式最多 35 + 人群最多 30 + 目标最多 25；
   时间不足时按制作难度扣分；不出镜时对依赖出镜的平台扣 14 分。 */
(function () {
  "use strict";
  const PB = window.PB;
  const { h } = PB;
  const OWNED = ["website", "newsletter", "zsxq"];

  PB.platformRank = function platformRank(ans) {
    const P = PB.content.tools.platforms;
    const a = Object.assign({ region: "both", formats: [], audiences: [], goals: [], time: "mid", face: "yes" }, ans || {});
    const out = [];
    P.forEach((p) => {
      if (a.region === "cn" && p.region === "global") return;
      if (a.region === "global" && p.region === "cn") return;
      const fm = p.formats.filter((f) => a.formats.indexOf(f) >= 0);
      const au = p.audiences.filter((x) => a.audiences.indexOf(x) >= 0);
      const go = p.goals.filter((g) => a.goals.indexOf(g) >= 0);
      let score = 10;
      score += a.formats.length ? Math.min(1, fm.length / Math.min(a.formats.length, 2)) * 35 : 17;
      score += a.audiences.length ? Math.min(1, au.length / Math.min(a.audiences.length, 2)) * 30 : 15;
      score += a.goals.length ? (go.length / a.goals.length) * 25 : 12;
      if (a.formats.length && !fm.length) score -= 10;
      if (a.time === "low") score -= p.effort >= 4 ? 18 : p.effort === 3 ? 6 : 0;
      if (a.time === "mid") score -= p.effort >= 5 ? 8 : p.effort === 4 ? 4 : 0;
      if (a.face === "no" && p.face) score -= 14;
      out.push({ p, score: PB.clamp(Math.round(score), 0, 100), fm, au, go, owned: OWNED.indexOf(p.id) >= 0 });
    });
    out.sort((x, y) => y.score - x.score || x.p.effort - y.p.effort);
    return out;
  };

  PB.tools.platform = {
    mount(shell) {
      const Q = PB.content.tools.platformQuiz;

      shell.body.append(h("div", { class: "tool-split" }, quiz, res), lib);
      const nameOf = (list, id) => (list.find((x) => x.id === id) || {}).name || id;

      function chipGroup(label, list, key, multi, hint) {
        const st = get();
        const wrap = h("div", { class: "quiz-block" }, h("div", { class: "field-label" }, h("span", { text: label }), hint ? h("span", { class: "muted small", style: { fontWeight: "400" }, text: hint }) : null));
        const chips = h("div", { class: "chips", role: multi ? "group" : "radiogroup", "aria-label": label });
