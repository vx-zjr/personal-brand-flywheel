# 每次推送到 main：校验内容 → 构建 → 把在线版本发布到 gh-pages 分支（GitHub Pages 从该分支托管）
# 在线地址：https://vx-zjr.github.io/personal-brand-flywheel/
name: 构建并部署在线版本

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验内容并构建
        run: python3 scripts/build.py

      - name: 发布到 gh-pages 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf _site && mkdir _site
          cp dist/index.html dist/build-info.json _site/
          if [ -f dist/og.png ]; then cp dist/og.png _site/; fi
          touch _site/.nojekyll
          version=$(python3 -c 'import json; print(json.load(open("_site/build-info.json"))["version"])')
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "部署 v${version}（${GITHUB_SHA::7}）"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
