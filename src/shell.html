<div class="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="pb-menu" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="pb-rail"></button>
    <a class="brand" href="#home" aria-label="{{TITLE}} 首页">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M17.53,5.11 A11,11 0 0 1 26.2,20.12" fill="none" stroke-width="5" style="stroke: var(--build)"/>
        <path d="M24.67,22.77 A11,11 0 0 1 7.33,22.77" fill="none" stroke-width="5" style="stroke: var(--maintain)"/>
        <path d="M5.8,20.12 A11,11 0 0 1 14.47,5.11" fill="none" stroke-width="5" style="stroke: var(--leverage)"/>
        <circle cx="16" cy="16" r="3" style="fill: var(--ink)"/>
      </svg>
      <span class="brand-name">{{TITLE}}</span>
      <span class="brand-ver">v{{VERSION}}</span>
    </a>
    <div class="topbar-actions">
      <button class="search-trigger" id="pb-search-btn" type="button" aria-label="搜索全部内容"><span class="label">搜索全部内容</span><span class="kbd">⌘ K</span></button>
      <button class="icon-btn" id="pb-theme" type="button" aria-label="切换主题" hidden></button>
    </div>
  </header>
  <div class="layout">
    <aside class="rail" id="pb-rail" aria-label="目录"></aside>
    <div class="scrim" id="pb-scrim" hidden></div>
    <main id="view" tabindex="-1">
      <p style="padding: 40px 0; color: var(--ink-3)">正在加载{{TITLE}}……如果长时间没有出现内容，请确认浏览器允许运行脚本。</p>
    </main>
  </div>
</div>
